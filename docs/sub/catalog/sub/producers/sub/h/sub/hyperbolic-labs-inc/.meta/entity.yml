  type: organization
  name: Hyperbolic Labs, Inc.
  aliases:
    - Hyperbolic
  identity_note: >-
    Hyperbolic Labs, Inc. is identified as owner/operator of the Hyperbolic
    platform in official Terms of Service dated March 24, 2025. The public
    2026 company brand is Hyperbolic and announces its October 21 Flux hosted
    inference release and October 27 Series A1 fundraising. Older legal terms
    do not establish the exact currently applicable supplemental Flux
    contract, jurisdiction of all infrastructure or beneficial ownership.
    Hosted third-party models and external inference routes remain with their
    original publishers and actual operators; company role is API platform
    operation, not original model authorship. No complete ownership,
    nationality/indirect control or sanctions certification has been done.
  references:
