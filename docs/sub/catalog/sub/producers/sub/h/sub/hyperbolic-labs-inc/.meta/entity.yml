      source:
        url: https://www.hyperbolic.ai/terms
      purposes: [identification, research]
      authority: official
      note: "March 24, 2025 first-party contract names Hyperbolic Labs, Inc. as platform owner/operator and allows supplemental service terms."
    - type: official-site
      source:
        url: https://www.hyperbolic.ai/
      purposes: [identification, research]
      authority: official
      note: "Current company brand and separately described GPU infrastructure and inference offering."
    - type: article
      source:
        url: https://www.hyperbolic.ai/blog/flux-inference-api
      purposes: [identification, research]
      authority: official
      note: "October 21, 2026 current Flux hosted model API launch; distinguishes provider-hosted and externally routed models."
    - type: article
      source:
        url: https://www.hyperbolic.ai/blog/a1-funding
      purposes: [research]
      authority: official
      note: "October 27, 2026 company funding and company/operator identity, not a complete cap table or ownership certification."
  relations:
