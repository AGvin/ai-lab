        url: https://vibrantlabs.com/
      purposes:
        - identification
        - research
      authority: official
    - type: official-site
      source:
        url: https://vibrantlabs.com/about
      purposes:
        - identification
        - research
      authority: official
      note: First-party company history stating that the team created Ragas.
    - type: repository
      source:
        url: https://github.com/vibrantlabsai/ragas
      purposes:
        - research
      authority: official
  relations:
