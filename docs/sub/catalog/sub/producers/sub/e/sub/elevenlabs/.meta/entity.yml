entity:
  id: catalog/producers/e/elevenlabs
  type: organization
  name: ElevenLabs
  identity_note: >-
    ElevenLabs develops and operates AI voice/audio products and the
    developer-facing ElevenAPI service, including text-to-speech,
    speech-to-text, speech generation and other supported audio workflows.
    The provider and its hosted API are distinct catalog identities.
    Individual available model revisions, voice assets and user-provided
    recordings are not thereby separate producer-owned catalog entries.
  references:
    - type: official-site
      source:
        url: https://elevenlabs.io/
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://elevenlabs.io/docs/overview/intro
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://elevenlabs.io/docs/api-reference/introduction
      purposes:
        - research
      authority: official
  relations:
    - type: produces
      target: catalog/services/model-apis/elevenlabs-api
