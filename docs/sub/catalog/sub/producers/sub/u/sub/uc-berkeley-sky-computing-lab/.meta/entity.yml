entity:
  id: catalog/producers/u/uc-berkeley-sky-computing-lab
  type: organization
  name: UC Berkeley Sky Computing Lab
  identity_note: >-
    UC Berkeley Sky Computing Lab is the research lab where vLLM originated. Its project page records the
    original research and contributors; later PyTorch Foundation hosting and the current community are separate
    from that origin. The producer relation records provenance, without implying sole current maintenance or a
    lab-operated inference service. Deployment, model and accelerator support, and workload-specific performance
    belong to the vLLM software record.
