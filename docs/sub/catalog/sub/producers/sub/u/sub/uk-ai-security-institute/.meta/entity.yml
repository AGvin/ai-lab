entity:
  id: catalog/producers/u/uk-ai-security-institute
  type: organization
  name: UK AI Security Institute
  identity_note: >-
    The UK AI Security Institute is a UK government research organization within the Department for Science,
    Innovation and Technology. Inspect AI's official site attributes the evaluation framework's development to
    the institute and Meridian Labs. The institute's producer role does not make evaluated models or third-party
    benchmarks government products. An Inspect result depends on its task, model, solver, scorer, tools and
    execution conditions; it is not a general certification of model safety.
