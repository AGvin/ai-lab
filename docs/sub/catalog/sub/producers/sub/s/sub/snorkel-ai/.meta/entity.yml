entity:
  id: catalog/producers/s/snorkel-ai
  type: organization
  name: Snorkel AI
  identity_note: >-
    Snorkel AI is the organization producing Snorkel Flow, its platform for data-centric AI development.
    The current enterprise page identifies the product and its integration with existing data, models
    and infrastructure; those integrations remain separate from Snorkel’s producer identity. Snorkel
    Flow is a commercial platform with deployment options that include customer infrastructure and
    Snorkel-hosted service. Its Kubernetes-based deployment and SDK do not imply that the full product
    shares the license of an open-source Snorkel library. Confirm the contracted deployment, data
    access, labeling workflows, model connections and support scope. Product version, security
    configuration and data-processing terms determine the operational boundary.
