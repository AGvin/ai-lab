  type: organization
  name: Sana Labs AB
  identity_note: >-
    Sana Labs AB is the organization identified in Sana’s current privacy notice and the producer
    identity for Sana Agents. Workday announced completion of its acquisition of Sana on November 4,
    2025. Sana Labs AB, the Sana Agents service, Sana Learn and the Workday parent remain distinct
    identities. The April 2026 privacy notice distinguishes customer processing from Sana’s controller
    role and describes limited joint-controller activities with Workday. Sana Agents product terms
    supplement the applicable master agreement and order, including third-party AI processing and
    restrictions on affiliate use. Confirm the service order, data-processing terms and connected-system
    permissions for a deployment; the acquisition does not make every Workday product part of Sana
    Agents.
