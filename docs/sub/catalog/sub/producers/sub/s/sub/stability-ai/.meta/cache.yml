          eligibility depends on organization revenue and applicable terms. This does
          not assign one license to every historical Stable Diffusion release. Local
          weights, Stability’s API and partner-hosted endpoints have separate hardware,
          processing, access and service conditions; model availability alone does
          not guarantee a deployment fits the intended workload.
