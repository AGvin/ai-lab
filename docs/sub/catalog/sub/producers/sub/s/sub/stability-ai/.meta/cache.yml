        identity_note: Stability AI is the producer of the represented Stable Diffusion
          family. Its release material identifies Stable Diffusion 3.5 and the Large,
          Large Turbo and Medium variants; hosting partners, runtimes and community
          fine-tunes remain distinct from original model production. Licensing must
