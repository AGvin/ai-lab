entity:
  id: catalog/producers/s/syntho
  type: organization
  name: Syntho
  identity_note: >-
    Syntho is the synthetic-data company that announced its acquisition of the MOSTLY AI brand on June
    9, 2026, with the announced branding “MOSTLY AI, powered by Syntho.” The announcement concerns the
    brand and preserves the earlier company and product history as separate provenance. The brand
    announcement does not establish acquisition of every historical MOSTLY AI software asset, platform,
    SDK or contract. No software-production or ownership relation is inferred here. For a purchase or
    migration, identify the actual platform, licensor, deployment agreement and support obligations from
    its own documentation and contract; a shared brand alone does not establish compatibility, data
    migration or continued service.
  references:
