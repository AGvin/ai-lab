entity:
  id: catalog/producers/s/stencil-labs
  type: organization
  name: Stencil Labs, Inc.
  identity_note: >-
    Stencil Labs, Inc. is the current organization developing and publishing OMP (Oh My Pi). Stencil’s
    official site identifies the corporation and its research tools; the OMP upstream credits Stencil
    while retaining its origin as a fork of Pi. Can Bölük is the original creator and a separately
    represented person. The current organizational maintainer, original author and upstream Pi lineage
    describe different roles. OMP’s MIT code and third-party notices govern its distribution; model
    subscriptions, credentials and local command or tool execution have separate boundaries. Stencil’s
    website is not evidence of a managed agent-execution service. Review provider configuration,
    filesystem permissions and tool approvals for the concrete OMP deployment.
  aliases:
    - Stencil
  references:
    - type: official-site
      source:
        url: https://stencil.so/
      purposes:
        - identification
        - research
      authority: official
    - type: repository
      source:
        url: https://github.com/stencil-hq
      purposes:
        - identification
        - research
      authority: official
    - type: repository
      source:
        url: https://github.com/can1357/oh-my-pi
      purposes:
        - research
      authority: official
      note: Official OMP repository identifies Stencil Labs as current project builder and publisher.
    - type: official-site
      source:
        url: https://stencil.so/about
      purposes:
        - identification
        - research
      authority: official
  relations:
