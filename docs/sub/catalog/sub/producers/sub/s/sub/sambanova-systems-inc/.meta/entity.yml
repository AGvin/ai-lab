  identity_note: >-
    SambaNova Systems, Inc. is a United States AI inference and systems company,
    founded in 2017, based in San Jose, California according to the company's
    October 2026 release. It designs reconfigurable dataflow AI infrastructure
    and offers a distinct hosted API, SambaCloud. Hosted third-party model
    availability is not authorship of those models, and a planned Oracle
    infrastructure collaboration is not evidence of currently deployed customer
    capacity or sole ownership of partner services. Complete current beneficial
    ownership, indirect holdings, sanctions and customer data-contract scope
    were not independently audited.
