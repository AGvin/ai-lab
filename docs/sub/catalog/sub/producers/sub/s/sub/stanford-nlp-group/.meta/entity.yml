entity:
  id: catalog/producers/s/stanford-nlp-group
  type: team
  name: Stanford NLP Group
  identity_note: >-
    Stanford NLP Group is a research group at Stanford University that explicitly lists DSPy among the
    software it develops. DSPy is published through stanfordnlp and has a wider research-author and
    contributor history; the research group, university and software project are distinct. DSPy’s MIT
    source distribution and its optimization methods are separate from model access, evaluation data and
    application deployment. Its license copyright names Stanford Future Data Systems, which should be
    preserved alongside the broader research provenance rather than treated as proof of exclusive group
    authorship. Users choose model endpoints, metrics and data; review those providers’ terms and the
    cost and privacy of optimization runs independently.
  references:
    - type: official-site
      source:
        url: https://nlp.stanford.edu/
      purposes:
        - identification
        - research
      authority: official
    - type: repository
      source:
        url: https://github.com/stanfordnlp/dspy
      purposes:
        - research
      authority: official
    - type: other
      source:
        url: https://github.com/stanfordnlp/dspy/blob/main/LICENSE
      purposes:
        - identification
        - research
      authority: official
  relations:
    - type: produces
      target: catalog/software/application-frameworks/programming-and-optimization/dspy
