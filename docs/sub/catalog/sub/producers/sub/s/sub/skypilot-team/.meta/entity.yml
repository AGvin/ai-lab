entity:
  id: catalog/producers/s/skypilot-team
  type: team
  name: SkyPilot Team
  identity_note: >-
    SkyPilot Team is the producer and maintainer identity for SkyPilot’s open-source compute
    orchestration software. The official history records its origin in UC Berkeley’s Sky Computing Lab
    and distinguishes the evolving team and commercial platform from that academic origin. SkyPilot
    orchestrates infrastructure supplied or operated by others. Cloud vendors, Kubernetes and Slurm
    projects, GPU providers and model publishers retain their own identities and terms. The open-source
    software and commercial SkyPilot Platform have separate deployment and support choices. Operators
    must control cloud credentials, resource permissions, cluster access and spend; selecting
    infrastructure through SkyPilot does not transfer its ownership to the team.
  references:
