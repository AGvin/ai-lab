entity:
  id: catalog/producers/s/snowflake
  type: organization
  name: Snowflake
  identity_note: >-
    Snowflake operates the managed Cortex model-inference API and currently maintains the separate
    TruLens evaluation and tracing framework. TruLens originated at TruEra; the project’s current site
    explicitly identifies Snowflake stewardship following the TruEra acquisition. Serving external
    models does not make Snowflake their original trainer. Cortex Inference, AI Functions, Agents,
    Search and warehousing are distinct services even where they share an account and billing. Check
    account roles, model lifecycle, regional or cross-region processing and consumption charges for
    hosted inference. TruLens is independently deployable software whose storage, instrumentation and
    judge-model choices require their own data controls; using it does not itself require adopting the
    Cortex Inference API.
