entity:
  id: catalog/producers/s/solo-io
  type: organization
  name: Solo.io
  identity_note: >-
    Solo.io is the original producer of agentgateway. Solo’s August 2025 announcement documents its
    donation to the Linux Foundation, and the project’s June 2026 announcement establishes current
    Agentic AI Foundation stewardship. The original producer relationship and current foundation
    maintenance describe different roles. Solo Enterprise for agentgateway and other Solo products have
    their own support and commercial conditions; they are not interchangeable with the independently
    governed open-source project. Review the chosen distribution, upstream license, authentication
    policies and provider or tool credentials for a deployment. Donation does not transfer authorship of
    connected agents, models or services to Solo.
  references:
    - type: official-site
      source:
        url: https://www.solo.io/
      purposes:
        - identification
        - research
      authority: official
    - type: article
      source:
        url: https://www.solo.io/blog/solo-contributes-agentgateway-linux-foundation
      purposes:
        - identification
        - research
      authority: official
      note: Solo.io documents that it created agentgateway and contributed the project to the Linux Foundation in 2025.
    - type: article
      source:
        url: https://agentgateway.dev/blog/2026-06-04-agentgateway-joins-aaif/
      purposes:
        - identification
        - research
      authority: official
    - type: repository
      source:
        url: https://github.com/agentgateway/agentgateway
      purposes:
        - identification
        - research
      authority: official
  relations:
    - type: produces
      target: catalog/software/gateways/model-gateways/agentgateway
