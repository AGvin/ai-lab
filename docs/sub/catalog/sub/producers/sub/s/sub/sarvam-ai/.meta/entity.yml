entity:
  id: catalog/producers/s/sarvam-ai
  type: organization
  name: Sarvam AI
  identity_note: >-
    Sarvam AI is the producer of the represented Sarvam model family. Its March 2026 release identifies
    the 30B and 105B models as an in-house training effort; current website terms identify the operating
    company as Axonwise Private Limited, doing business as Sarvam AI. The released 30B/105B weights and
    their Apache 2.0 distribution are distinct from hosted APIs, Indus, Samvaad and Sarvam’s speech,
    translation and document products. Check the exact checkpoint license, runtime and hardware for
    local deployment, and the applicable account terms for hosted access. IndiaAI compute support and
    NVIDIA collaboration establish infrastructure contributions, not replacement model authorship.
