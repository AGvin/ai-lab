        name: Skild AI
        identity_note: Skild AI develops the represented Skild Brain robotics model
          family and its S1 model. Its technical accounts describe an in-house robotics
          effort, including S1’s learning from video demonstrations; the company remains
          distinct from its models and from robot manufacturers or compute suppliers.
          Evaluate a concrete Skild model and deployment together with its robot hardware,
          control interfaces, operating limits and validation process. Demonstrations
          and architectural descriptions alone do not establish unrestricted weight
          access or a safety case for every environment. NVIDIA infrastructure use
          does not make NVIDIA the model producer. Availability, integration support
          and commercial conditions belong to the relevant model release and deployment
          agreement.
