entity:
  id: catalog/producers/s/salesforce
  type: organization
  name: Salesforce
  identity_note: >-
    Salesforce is the organization producing Agentforce, its agent platform built on Salesforce
    Platform. The Agentforce product page establishes this provenance; the company identity remains
    broader than any individual agent, application or packaged workflow. Agentforce connects business
    data, metadata and tools under the customer’s Salesforce configuration. Data 360/Data Cloud,
    MuleSoft, Slack and other Salesforce applications remain separate product surfaces. Assess
    subscriptions, enabled features, connector permissions and the actions an agent can perform for the
    intended deployment; a Salesforce relationship alone does not establish entitlement to every
    Agentforce capability.
  aliases:
    - Salesforce, Inc.
  references:
    - type: official-site
      source:
        url: https://www.salesforce.com/
      purposes:
        - identification
        - research
      authority: official
    - type: official-site
      source:
        url: https://www.salesforce.com/platform/agentforce-platform/
      purposes:
        - identification
        - research
      authority: official
  relations:
    - type: produces
      target: catalog/services/infrastructure/salesforce-agentforce
