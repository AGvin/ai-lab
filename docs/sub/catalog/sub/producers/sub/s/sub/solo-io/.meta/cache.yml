        name: Solo.io
        identity_note: Solo.io is the original producer of agentgateway. Solo’s August
          2025 announcement documents its donation to the Linux Foundation, and the
          project’s June 2026 announcement establishes current Agentic AI Foundation
          stewardship. The original producer relationship and current foundation maintenance
          describe different roles. Solo Enterprise for agentgateway and other Solo
          products have their own support and commercial conditions; they are not
          interchangeable with the independently governed open-source project. Review
          the chosen distribution, upstream license, authentication policies and provider
          or tool credentials for a deployment. Donation does not transfer authorship
          of connected agents, models or services to Solo.
