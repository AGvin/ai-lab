      source:
        url: https://www.firecrawl.dev/
      purposes:
        - identification
        - research
      authority: official
    - type: terms-of-service
      source:
        url: https://www.firecrawl.dev/terms-of-service
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://docs.firecrawl.dev/
      purposes:
