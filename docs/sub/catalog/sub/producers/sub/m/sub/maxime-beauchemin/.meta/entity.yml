entity:
  id: catalog/producers/m/maxime-beauchemin
  type: individual
  name: Maxime Beauchemin
  identity_note: >-
    Maxime Beauchemin is the original creator and producer who started Apache Airflow at Airbnb in
    October 2014. Airbnb's organizational context and current Apache Software Foundation governance
    remain distinct from that creator provenance. Apache's project history establishes this origin and
    the later Apache incubation and top-level-project transition. Creator credit is not a claim of sole
    current maintenance, commercial support, or ownership of every Airflow deployment; those
    responsibilities follow the project, distributor, and operator involved.
  aliases:
    - Max Beauchemin
  references:
    - type: documentation
      source:
        url: https://airflow.apache.org/docs/apache-airflow/stable/project.html
      purposes:
        - identification
        - research
      authority: upstream
      note: Current Apache Airflow project history identifies Maxime Beauchemin as the person who started Airflow at Airbnb in October 2014.
  relations:
    - type: produces
      target: catalog/software/workflow-engines/data-and-compute-orchestration/apache-airflow
