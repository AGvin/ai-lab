  type: organization
  name: MOSTLY AI Solutions MP GmbH
  identity_note: >-
    MOSTLY AI Solutions MP GmbH is the historical company producer behind the MOSTLY AI Data
    Intelligence Platform. The company account records a 2017 origin in Vienna, and its 2025 releases
    describe the separate SDK and data-intelligence environment. The July 11, 2025 public handbook
    establishes the historical company name, not independently verified present corporate status. Syntho
    announced acquisition of the MOSTLY AI brand on June 9, 2026; that brand transaction does not by
    itself establish original software authorship, software ownership, or support obligations for
    earlier deployments. The separately released SDK license does not cover every platform component.
