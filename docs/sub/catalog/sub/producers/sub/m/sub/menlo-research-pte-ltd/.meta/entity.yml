entity:
  id: catalog/producers/m/menlo-research-pte-ltd
  type: organization
  name: Menlo Research Pte Ltd
  identity_note: >-
    Menlo Research Pte Ltd, branded as Menlo Research, is the organization producing Jan. The legal
    organization remains distinct from the Jan software identity and community contributors. Jan's
    published privacy policy, last updated January 16, 2025, names this company for the desktop app and
    website. That policy is scoped to those services; it does not make Menlo the author of connected
    third-party models or extend local-model data-handling claims to every cloud provider or newer agent
    product.
  aliases:
    - Menlo Research
  references:
    - type: other
      source:
        url: https://www.jan.ai/docs/desktop/privacy-policy
      purposes:
        - identification
        - research
      authority: official
      note: Jan's first-party privacy policy identifies Menlo Research Pte Ltd as the company providing Jan desktop and website services.
    - type: official-site
      source:
        url: https://www.jan.ai/
      purposes:
        - research
      authority: official
  relations:
    - type: produces
      target: catalog/software/interfaces-and-workspaces/integrated-workspaces/jan
