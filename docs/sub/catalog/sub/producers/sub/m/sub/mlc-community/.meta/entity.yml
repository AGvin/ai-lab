entity:
  id: catalog/producers/m/mlc-community
  type: organization
  name: MLC Community
  identity_note: >-
    MLC Community is the canonical open-community producer identity for MLC LLM. First-party project
    history records an early multi-institution origin involving contributors from CMU Catalyst, UW
    SAMPL, SJTU, OctoML, and the MLC community rather than one sole company. Contributor affiliations
    and supporting organizations are not sole ownership or maintenance claims. Community committers
    coordinate reviews and technical decisions; model licenses, Apache TVM dependencies, hardware
    support and deployment obligations remain separate from community authorship and require their own
    software or model evidence.
  references:
    - type: official-site
      source:
        url: https://mlc.ai/
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://llm.mlc.ai/docs/community/guideline.html
      purposes:
        - identification
        - research
      authority: official
    - type: article
      source:
        url: https://blog.mlc.ai/2023/05/01/bringing-accelerated-llm-to-consumer-hardware
      purposes:
        - research
      authority: official
      note: Early first-party MLC LLM provenance identifies initiating contributors from CMU Catalyst, UW SAMPL, SJTU, OctoML, and the MLC community.
  relations:
    - type: produces
      target: catalog/software/inference-runtimes/inference-engines/mlc-llm
