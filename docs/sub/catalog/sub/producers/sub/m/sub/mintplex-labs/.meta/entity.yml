entity:
  id: catalog/producers/m/mintplex-labs
  type: organization
  name: Mintplex Labs
  identity_note: >-
    Mintplex Labs is the organization producing AnythingLLM. The organization remains distinct from the
    AnythingLLM software identity and from its hosted or self-hosted operating surfaces. The official
    company site and AnythingLLM documentation identify this producer. Local installation, managed
    hosting, external model providers, and agent integrations have separate data flows and support
    responsibilities; a local-first product description does not mean every configuration is offline or
    that Mintplex owns the connected models.
  references:
    - type: official-site
      source:
        url: https://mintplexlabs.com/
      purposes:
        - identification
        - research
      authority: official
      note: Mintplex Labs' official site identifies AnythingLLM as a product it builds.
    - type: repository
      source:
        url: https://github.com/Mintplex-Labs/anything-llm
      purposes:
        - research
      authority: official
    - type: documentation
      source:
        url: https://docs.anythingllm.com/installation-desktop/overview
      purposes:
        - identification
        - research
      authority: official
  relations:
    - type: produces
      target: catalog/software/interfaces-and-workspaces/integrated-workspaces/anythingllm
