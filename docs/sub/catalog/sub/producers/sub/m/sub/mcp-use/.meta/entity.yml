entity:
  id: catalog/producers/m/mcp-use
  type: organization
  name: Manufact, Inc.
  identity_note: >-
    Manufact, Inc. is the company/team behind the open-source mcp-use framework and its TypeScript and
    Python SDKs. The company uses the former mcp-use publisher brand in its history; the SDK retains the
    mcp-use name. The same team builds the open-source framework and operates Manufact Cloud. Hosted
    deployment, analytics, service terms, and commercial support are separate from the SDKs; external
    MCP servers, model providers, client applications, and the MCP specification retain their own
    ownership and operational responsibilities.
  aliases:
    - mcp-use
    - Manufact
  references:
    - type: official-site
      source:
        url: https://manufact.com/
      purposes:
        - identification
        - research
      authority: official
    - type: repository
      source:
        url: https://github.com/mcp-use/mcp-use
      purposes:
        - identification
        - research
      authority: official
    - type: other
      source:
        url: https://manufact.com/company
      purposes:
        - identification
        - research
      authority: official
      note: The company page states that the same team builds mcp-use and Manufact Cloud and identifies Manufact, Inc. in its copyright surface.
  relations:
