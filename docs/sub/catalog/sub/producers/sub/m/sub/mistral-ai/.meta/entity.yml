entity:
  id: catalog/producers/m/mistral-ai
  type: organization
  name: Mistral AI
  identity_note: >-
    Mistral AI develops model families and publishes developer software and hosted services, including
    Mistral Studio, Vibe, and the direct Mistral API. Its commercial terms identify the French Mistral
    AI corporation or the affiliate specified in an order form. Model releases, API access, Studio's
    developer platform, and Vibe's productivity/coding agent are separate identities. Licenses vary by
    exact artifact: the official catalog includes Apache 2.0, modified MIT, noncommercial and commercial
    offerings. Devstral's original release was developed with All Hands AI; that provenance does not
    establish that every later release or integration has identical authorship or licensing. Third-party
    models made available through Mistral retain their upstream producer. Direct Mistral hosting,
    partner-served deployments and customer infrastructure have different contractual and operational
    responsibilities. Review the current model card, deployment terms, service data controls and agent
    permissions for the actual route; a producer relation does not guarantee model availability, support
    or safe autonomous execution.
