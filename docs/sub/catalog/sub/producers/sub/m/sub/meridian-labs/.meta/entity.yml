entity:
  id: catalog/producers/m/meridian-labs
  type: organization
  name: Meridian Labs
  identity_note: >-
    Meridian Labs is an independent AI-evaluation nonprofit, the current development home of Petri and
    Bloom, and a credited co-developer of Inspect AI with the UK AI Security Institute. Anthropic's
    original production of Petri and Bloom remains separate from their subsequent development at
    Meridian. Inspect's co-development credit does not establish sole ownership or an additional
    maintenance relation; evaluation software provenance does not guarantee a model's safety or transfer
    responsibility for running untrusted evaluation workloads.
