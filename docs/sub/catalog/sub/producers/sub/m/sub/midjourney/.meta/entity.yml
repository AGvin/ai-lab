entity:
  id: catalog/producers/m/midjourney
  type: organization
  name: Midjourney
  identity_note: >-
    Midjourney is the independent, community-funded research lab that develops the Midjourney
    image-generation models and operates their hosted creative product. The organization, model family,
    and web/Discord product surfaces have separate identities. Niji is a specialized series developed
    with Spellbrush, so the Midjourney producer relationship does not imply sole authorship of every
    collaborative model. Version behavior, availability, subscription/GPU accounting, personalization
    and output-use terms belong to the applicable model or service release. Access to the hosted product
    does not itself establish downloadable weights, an open-source model license, or unrestricted rights
    to every input or output.
  references:
