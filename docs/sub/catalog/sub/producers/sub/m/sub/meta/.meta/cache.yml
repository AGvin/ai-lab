        id: catalog/producers/m/meta
        type: organization
        name: Meta
        identity_note: Meta is the technology company behind the Llama and Muse model
          families, the Meta AI assistant and Muse personal-agent services, MTIA accelerators,
          and the Faiss library. These are distinct research, software, hardware,
          and hosted-product responsibilities. Llama releases use their own community
          licenses; Faiss uses an MIT software license. Neither establishes the terms
          for Muse or Meta AI, whose account, data, connector, and action permissions
          belong to the specific service. The MTIA program is developed with Broadcom,
          and production use inside Meta does not establish a retail accelerator offering.
          A producer relation records Meta's role without making every contributor,
          third-party integration, or downstream model deployment Meta-owned or Meta-operated.
