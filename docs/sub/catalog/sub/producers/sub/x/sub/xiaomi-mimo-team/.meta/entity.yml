entity:
  id: catalog/producers/x/xiaomi-mimo-team
  type: team
  name: Xiaomi MiMo Team
  identity_note: >-
    Xiaomi MiMo Team is the producing team identified by the MiMo site and official XiaomiMiMo model registry.
    The MiMo family is separate from Xiaomi corporate identities, consumer devices and hosted MiMo product
    surfaces. Checkpoint licenses, architecture code, inference requirements and publication revisions must be
    checked per model. Registry examples that load custom model code require review of that code and its pinned
    revision. Publishing a new checkpoint does not automatically complete catalog intake or expand the team's
    canonical family membership.
  references:
    - type: official-site
      source:
        url: https://mimo.xiaomi.com/
      purposes:
        - identification
        - research
      authority: official
    - type: registry
      source:
        url: https://huggingface.co/XiaomiMiMo
      purposes:
        - identification
        - research
      authority: official
    - type: registry
      source:
        url: https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Pro-RL
      purposes:
        - research
      authority: official
  relations:
    - type: produces
      target: catalog/models/xiaomi-mimo/mimo
