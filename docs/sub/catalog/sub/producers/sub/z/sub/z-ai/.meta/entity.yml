entity:
  id: catalog/producers/z/z-ai
  type: organization
  name: Z.AI
  identity_note: >-
    Z.AI is the producer identity used by the current GLM documentation and official zai-org model registry. The
    long-lived GLM family and its individually reviewed models remain separate from the organization and from
    hosted access plans. Model-weight licenses, API availability and commercial subscriptions need assessment
    for the exact model and access route. Provider benchmark claims are not independent catalog evaluations.
    Historical Zhipu AI wording alone does not establish an additional parent or ownership relation in the
    canonical graph.
  references:
    - type: official-site
      source:
        url: https://z.ai/company
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://docs.z.ai/guides/overview/overview
      purposes:
        - research
      authority: official
    - type: registry
      source:
        url: https://huggingface.co/zai-org
      purposes:
        - research
      authority: official
  relations:
    - type: produces
      target: catalog/models/z-ai/glm
