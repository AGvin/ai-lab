entity:
  id: catalog/producers/z/zenml-gmbh
  type: organization
  name: ZenML GmbH
  identity_note: >-
    ZenML GmbH is the company that ZenML's documentation identifies as creating and maintaining the open-source
    project with community contributors. Current ZenML Labs branding and the separately documented Kitaru
    project do not replace this canonical company or the ZenML software identity. Open-source framework
    capabilities and commercial management services have separate boundaries. The Python package enables
    anonymized usage analytics by default and documents an opt-out command. Pipeline integrations still require
    their own infrastructure permissions, credentials and data-handling decisions.
  references:
    - type: official-site
      source:
        url: https://www.zenml.io/
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://docs.zenml.io/reference/global-settings
      purposes:
        - identification
        - research
      authority: official
      note: ZenML documentation explicitly identifies ZenML GmbH as the startup that creates and maintains ZenML.
  relations:
    - type: produces
      target: catalog/software/model-and-data-platforms/lifecycle-platforms/zenml
    - type: maintains
      target: catalog/software/model-and-data-platforms/lifecycle-platforms/zenml
