entity:
  id: catalog/producers/z/zilliz
  type: organization
  name: Zilliz
  identity_note: >-
    Zilliz is the organization that created Milvus and operates Zilliz Cloud. Milvus's open-source and
    foundation-governance history is distinct from the company's managed cloud offering. Shared database
    technology does not make a cloud subscription, its service commitments or managed deployment features part
    of self-managed Milvus. Match release compatibility, deployment topology, access controls and workload
    conditions before applying provider scale or performance claims to another installation.
