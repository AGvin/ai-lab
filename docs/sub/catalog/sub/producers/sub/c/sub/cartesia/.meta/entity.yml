entity:
  id: catalog/producers/c/cartesia
  type: organization
  name: Cartesia
  identity_note: >-
    Cartesia develops real-time speech and conversational voice AI models
    and operates a hosted voice API offering text-to-speech, speech-to-text
    and related audio/voice workflows. Its model, voice-agent platform,
    vendor organization and developer-facing Cartesia Voice API have
    separate lifecycle and rights boundaries.
  references:
    - type: official-site
      source:
        url: https://cartesia.ai/
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://docs.cartesia.ai/get-started/overview
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://docs.cartesia.ai/api-reference/tts/bytes
      purposes:
        - research
      authority: official
  relations:
    - type: produces
      target: catalog/services/model-apis/cartesia-voice-api
