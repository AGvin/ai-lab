        - research
      authority: official
    - type: documentation
      source:
        url: https://workos.com/docs
      purposes:
        - research
      authority: official
    - type: release-notes
      source:
        url: https://workos.com/changelog/agent-auth
      purposes:
        - research
      authority: official
