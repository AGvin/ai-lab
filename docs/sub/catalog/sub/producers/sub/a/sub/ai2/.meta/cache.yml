        - type: official-site
          source:
            url: https://allenai.org/
          purposes:
          - identification
          - research
          authority: official
          note: Current Ai2 organization and research portfolio.
        - type: official-site
          source:
            url: https://allenai.org/about
          purposes:
          - identification
          - research
          authority: official
          note: First-party nonprofit identity, Seattle location and Paul Allen 2014
            founding context.
        - type: official-site
          source:
            url: https://allenai.org/open-data
          purposes:
          - identification
          - research
          authority: official
          note: Original Ai2 Reasoning Challenge data publication.
        - type: repository
          source:
            url: https://github.com/allenai/aristo-leaderboard
          purposes:
          - research
          authority: official
          note: First-party tools/repository references to the ARC benchmark; software
            is distinct from data.
        - type: repository
          source:
