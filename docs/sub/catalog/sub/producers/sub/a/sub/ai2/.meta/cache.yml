        identity_note: Ai2 is the current brand of the Seattle-based nonprofit Allen
          Institute for AI, founded in 2014 by Paul Allen. It produces openly published
          research resources, including the original ARC and OpenBookQA science QA
          datasets and the 2019 DROP paragraph-reasoning, 2020 SciFact scientific
          fact-checking and 2021 Qasper research-paper question-answering datasets.
          The organization's name and this dataset's acronym must not be confused
          with the independent ARC Prize Foundation or ARC-AGI benchmark. Product-level
          data licenses, upstream contributors, and partnerships are not universal
          ownership grants. Ai2 also publishes the Olmo 3 model family; original model
          and training-material licenses remain distinct from dataset rights and website/service
          terms.
