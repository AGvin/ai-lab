entity:
  id: catalog/producers/a/ai2
  type: organization
  name: Ai2
  aliases:
    - Allen Institute for AI
    - AI2
  identity_note: >-
    Ai2 is the current brand of the Seattle-based nonprofit Allen Institute for AI,
    founded in 2014 by Paul Allen. It produces openly published research resources,
    including the 2018 Ai2 Reasoning Challenge science question dataset.
    The organization's name and this dataset's acronym must not be confused with
    the independent ARC Prize Foundation or ARC-AGI benchmark. Product-level data
    licenses, upstream contributors, and partnerships are not universal ownership grants.
