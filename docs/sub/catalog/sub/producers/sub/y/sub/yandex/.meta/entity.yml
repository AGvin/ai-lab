entity:
  id: catalog/producers/y/yandex
  type: organization
  name: Yandex
  identity_note: >-
    Yandex is the publishing organization for the represented AliceAI-T5 model family. Its official model
    registry and model cards establish checkpoint provenance independently of Alice consumer applications,
    search and hosted services. Base-model behavior, model code, checkpoint licenses and hardware requirements
    are specific to the selected publication. A model card's custom-code loading example is an execution
    decision to review and pin, not an assurance from the producer name. New model releases require their own
    identity and operating assessment.
    SECURITY POLICY: DANGEROUS — NOT RECOMMENDED. Yandex is Russia-based;
    this catalog resource is research/threat-monitoring only, regardless of
    security tests, permissive licenses or missing sanctions findings.
    Do not recommend deployment or transmit sensitive data to Yandex services.
    This classification does not claim detected malware in this model.
