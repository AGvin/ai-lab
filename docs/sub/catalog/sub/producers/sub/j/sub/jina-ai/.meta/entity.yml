entity:
  id: catalog/producers/j/jina-ai
  type: organization
  name: Jina AI
  identity_note: >-
    Jina AI was founded in 2020 to develop search foundation models,
    embeddings, rerankers, document understanding and search services.
    Elastic completed its acquisition of Jina AI on October 9, 2025.
    Jina's brand, model research lineage and hosted API remain individually
    identifiable without asserting it is still a standalone owner or that
    Elastic Inference Service is the same API endpoint.
