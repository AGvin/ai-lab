        id: catalog/services/assistant-workspaces/muse
        type: service
        name: Muse
        identity_note: Muse is Meta's hosted personal AI agent, introduced on September
          8, 2026. It is separate from the Muse model family and Muse Spark models
          and the Meta AI assistant. Muse plans tasks, uses a browser and connected
          applications, and continues delegated work after the client closes. Meta
          operates its dedicated Muse Secure VM; apps, web and supported messaging
          surfaces are clients. Personal context, memory and connected accounts are
          part of this service. Meta describes Sentinel as the authority for connector
          actions and network access, with scoped user approvals, isolated credential
          handling and an audit trail. These controls depend on the requested action
          and granted access; they are the vendor's architecture description, not
          an assurance that every action is error-free. The launch rollout covered
          the United States on iOS, Android and web. Confidential VM, AI-glasses access
          and additional payment/login integrations were announced separately as forthcoming.
          Consult current documentation for availability, app permissions, data/training
          controls and plan limits.
        aliases:
        - Meta Muse
        references:
        - type: article
          source:
            url: https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/
          purposes:
          - identification
          - research
          authority: official
        - type: official-site
          source:
            url: https://ai.meta.com/events/
          purposes:
          - research
          authority: official
        - type: documentation
          source:
            url: https://research.meta.ai/blog/security-and-safety-for-ai-agents-our-approach-with-muse
          purposes:
          - identification
          - research
          authority: official
        relations:
