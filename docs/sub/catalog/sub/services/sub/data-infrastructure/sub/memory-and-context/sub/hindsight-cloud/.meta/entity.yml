  type: service
  name: Hindsight Cloud
  identity_note: >-
    Vectorize-operated, self-service hosted Hindsight agent-memory service
    with managed storage, model processing, HTTP APIs, MCP and SDK access,
    team workspaces and metered billing. Unlike the MIT self-hosted Hindsight
    engine, the multi-tenant cloud is operated by Vectorize; enterprise
    single-tenant/BYOC/on-premises editions have different operating and
    contract boundaries. Publisher uptime, security and recovery claims are
    not independently verified by AI Lab.
