      purposes: [identification, research]
      authority: official
    - type: documentation
      source:
        url: https://fal.ai/docs/documentation
      purposes: [research]
      authority: official
    - type: documentation
      source:
        url: https://fal.ai/legal/terms-of-service
      purposes: [research]
      authority: official
  relations:
