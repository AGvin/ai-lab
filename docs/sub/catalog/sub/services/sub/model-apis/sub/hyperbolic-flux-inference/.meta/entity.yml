entity:
  id: catalog/services/model-apis/hyperbolic-flux-inference
  type: service
  name: Hyperbolic Flux Inference
  aliases:
    - Hyperbolic Inference API
    - Hyperbolic Flux
    - Flux Inference
  identity_note: >-
    Active Hyperbolic-hosted serverless inference API, launched as Flux on
    October 21, 2026 as a new generation of the earlier Hyperbolic inference
    service. It is distinct from the company's Forge compute orchestrator,
    GPU rental/managed Kubernetes infrastructure, dedicated GPU deployment
    and trained models originally released by third parties. The published
    OpenAI-compatible base https://api.hyperbolic.ai/inference/v1 serves
    supported models using prepaid account credentials. The vendor documents
    both Hyperbolic-hosted models and externally routed provider backends:
    customer data and model rights may depend on third-party routes. Some
    models are previews; model catalog, endpoints, legacy-key migration,
    quotas, regions, token prices and contracts can change.
