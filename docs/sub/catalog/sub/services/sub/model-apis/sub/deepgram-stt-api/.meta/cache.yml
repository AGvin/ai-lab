            url: https://developers.deepgram.com/reference/speech-to-text/listen-streaming
          purposes:
          - research
          authority: official
        - type: release-notes
          source:
            url: https://developers.deepgram.com/changelog/2026/10/27
          purposes:
          - research
          authority: official
