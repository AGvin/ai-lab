entity:
  id: catalog/services/model-apis/friendli-model-apis
  type: service
  name: Friendli Model APIs
  aliases:
    - FriendliAI Model APIs
    - Friendli Model API
    - Friendli Serverless Model API
  identity_note: >-
    FriendliAI's active hosted, provider-operated serverless model inference API,
    distinct from Friendli Dedicated Endpoints, self-managed Friendli Container
    and models originally developed by other organizations. First-party help
    documents https://api.friendli.ai/serverless/v1 and OpenAI-compatible chat
    completions plus a separately documented Messages interface. Model IDs,
    API feature support, account entitlements, quotas, regions, pricing and
    data handling terms may change. A current model-availability listing is
    not proof of original model authorship, rights clearance, or sanctions status.
  references:
