        url: https://learn.friendli.ai/articles/4213111023-q10-1-how-do-i-connect-friendliai-with-litellm-or-other-openai-compatible-client
      purposes: [identification, research]
      authority: official
      note: "August 2026 vendor documentation of the serverless and dedicated base URLs and compatibility surfaces."
