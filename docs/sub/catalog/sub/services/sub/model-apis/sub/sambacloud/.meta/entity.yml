      purposes: [identification, research]
      authority: official
      note: "Current hosted service dashboard, API quickstart, API-key authentication and OpenAI-compatible endpoint."
    - type: documentation
      source:
        url: https://docs.sambanova.ai/docs/en/integrations/vscode
      purposes: [identification, research]
      authority: official
      note: "Vendor integration guide shows active SambaCloud access separate from other deployment types."
    - type: product-page
      source:
        url: https://sambanova.ai/solutions/ai-natives-enterprises
      purposes: [identification, research]
      authority: official
      note: "Distinguishes hosted SambaCloud API from dedicated and on-premises SambaStack."
    - type: official-site
