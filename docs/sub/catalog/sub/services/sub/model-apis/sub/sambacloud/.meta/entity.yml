entity:
  id: catalog/services/model-apis/sambacloud
  type: service
  name: SambaCloud
  aliases:
    - SambaNova Cloud
    - SambaNova Cloud Inference API
  identity_note: >-
    SambaNova Systems' active managed hosted inference API for accessing third-party
    models over an OpenAI-compatible HTTP interface. This commercial service is
    distinct from SambaStack dedicated/on-premises inference deployments, the
    company's reconfigurable dataflow chips and any model trained by another
    publisher. Model catalog, preview versus production status, plan access, data
    handling terms, rate limits, endpoints and prices must be verified by
    exact account/region/revision. Public documentation does not authorize a
    universal data-retention or training-use guarantee for every service contract.
