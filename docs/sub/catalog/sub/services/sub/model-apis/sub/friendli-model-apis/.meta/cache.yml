          - research
          authority: official
          note: Current serverless hosted Model APIs, separate from dedicated deployment.
        - type: documentation
          source:
            url: https://learn.friendli.ai/articles/4213111023-q10-1-how-do-i-connect-friendliai-with-litellm-or-other-openai-compatible-client
          purposes:
          - identification
          - research
          authority: official
          note: August 2026 vendor documentation of the serverless and dedicated base
            URLs and compatibility surfaces.
        - type: documentation
          source:
            url: https://learn.friendli.ai/articles/6490778657-q1-1-which-models-are-available-on-model-api-serverless
          purposes:
          - research
          authority: official
          note: Serverless catalog is curated and mutable, unlike dedicated endpoint
            deployment.
        - type: official-site
          source:
