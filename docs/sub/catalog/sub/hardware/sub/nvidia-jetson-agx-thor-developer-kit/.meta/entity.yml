entity:
  id: catalog/hardware/nvidia-jetson-agx-thor-developer-kit
  type: hardware
  name: NVIDIA Jetson AGX Thor Developer Kit
  identity_note: >-
    NVIDIA's released 2025 Blackwell-based Jetson AGX Thor reference development
    computer, comprising a T5000 128 GB module, NVIDIA carrier board, local
    NVMe storage and developer interfaces for physical-AI/robotics prototyping.
    It is a separate system-level purchase/deployment identity from a standalone
    T5000 or T4000 production module and from automotive DRIVE AGX Thor kits.
    Module power/performance figures do not establish complete-kit wall draw,
    deployed robot safety or actual application throughput.
