        type: hardware
        name: NVIDIA Jetson T4000
        identity_note: NVIDIA Jetson T4000 is a released Blackwell-based 64 GB LPDDR5X
          production module, not the T5000 or a complete Jetson AGX Thor Developer
          Kit. NVIDIA lists 273 GB/s memory bandwidth, configurable 40-70 W module
          power, January 2026 availability and lifecycle through January 2036. An
