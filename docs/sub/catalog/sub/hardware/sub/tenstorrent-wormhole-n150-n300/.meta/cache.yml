        id: catalog/hardware/tenstorrent-wormhole-n150-n300
        type: hardware-product
        name: Tenstorrent Wormhole n150/n300
        identity_note: Tenstorrent's Wormhole PCIe n150/n300 family includes n150d/n150s
          and n300d/n300s with distinct single/dual ASIC and active/passive cooling
          configurations. Current first-party installation requirements give PCIe
          4.0 x16 host, up to 160 W for n150 boards versus up to 300 W for n300 boards,
          and host-airflow requirements for boards without an active cooling kit.
          Do not transfer one card's power, HBM/ASIC count, throughput or firmware
          support to the family or Galaxy systems. Deployment requires supported host,
          cabling, OS, TT-Metal/TT-Forge and validated models.
