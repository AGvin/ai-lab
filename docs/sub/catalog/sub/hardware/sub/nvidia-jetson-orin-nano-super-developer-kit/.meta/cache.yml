        type: hardware
        name: NVIDIA Jetson Orin Nano Super Developer Kit
        identity_note: NVIDIA Jetson Orin Nano Super Developer Kit combines an 8 GB
          LPDDR5 Ampere-based development module/carrier with a software-enabled Super
          mode (up to 67 INT8 TOPS, 102 GB/s specified memory bandwidth, 7–25 W published
          power modes). Eligible older Orin Nano development kits can be updated to
          Super; Super is not a wholly separate production-module silicon SKU. Model
