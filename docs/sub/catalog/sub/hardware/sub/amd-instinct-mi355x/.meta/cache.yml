        type: hardware-product
        name: AMD Instinct MI355X
        aliases:
        - MI355X
        identity_note: AMD's MI355X is a CDNA 4 OAM accelerator with 288 GB HBM3E
          per GPU, distinct from its eight-accelerator platform and sibling SKU. AMD's
          microarchitecture documentation distinguishes MI350X air cooling from MI355X
          direct liquid cooling. The acceptance guide's HBM3 wording and MI355X overview's
          MI350X reference conflict with the SKU/product and architecture sources;
          use those sources for exact identity and memory type. ROCm/OS, firmware,
          power and cooling require configuration-specific validation. Ownership/control
          review remains pending; no runtime or adoption clearance.
