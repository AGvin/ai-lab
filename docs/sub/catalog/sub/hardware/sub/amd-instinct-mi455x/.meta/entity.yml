  name: AMD Instinct MI455X
  identity_note: >-
    AMD Instinct MI455X is a launched CDNA 5 GPU (manufacturer launch date July 23, 2026) with 432 GB HBM4 and 23.3 TB/s peak memory bandwidth. The Enhanced Accelerator Module (EAM) uses direct liquid cooling and forms one GPU component of AMD Helios rather than constituting an entire rack-scale system. Advertised precision and scale-up numbers are per specified GPU or interconnect topology; runtime, availability, legal/control-chain and independent performance remain unverified.
