        type: hardware-product
        name: FuriosaAI RNGD
        identity_note: FuriosaAI RNGD is a 48 GB HBM3 PCIe Gen5 x16 inference NPU
          built around a Tensor Contraction Processor. Official 2026 developer documentation
          states a 150 W TDP, while Furiosa's product specification page states 180
          W; treat this discrepancy as unresolved for host cooling and power budgeting.
          INT4/INT8 peak figures and SR-IOV capability are vendor specifications,
          not independent inference throughput.
