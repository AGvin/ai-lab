        identity_note: Moonshot AI's released reasoning/tool-use checkpoint is distinct
          from Kimi K3 and hosted API aliases. The publisher reports 1T total and
          32B activated parameters, a 256K context, MoE architecture and native INT4
          quantization-aware post-training. Active parameters do not establish memory
          fit. Weights and code use Modified MIT terms, including Kimi K2 interface
