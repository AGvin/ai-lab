          revenue; the exact license governs. Publisher benchmarks are not reproduced
          here. Ultimate beneficial ownership and control rights remain unverified;
          provenance review is pending, not evidence of Russian ownership or adoption
          clearance. Use the checkpoint's native tool parser and chat format. Review
          and pin remote code before loading; sandbox tool execution, validate arguments
          and keep secrets outside model-controlled inputs. Hosted API behavior and
          third-party quantizations are separate surfaces.
