entity:
  id: catalog/models/z-ai/glm/models/glm-5-3
  type: model
  name: GLM-5.3
  references:
    - type: registry
      source:
        url: https://huggingface.co/zai-org/GLM-5.3
      purposes:
        - identification
        - research
      authority: official
    - type: repository
      source:
        url: https://github.com/zai-org/GLM-5
      purposes:
        - research
      authority: official
  relations:
    - type: member-of
      target: catalog/models/z-ai/glm
  identity_note: >-
    GLM-5.3 is a distinct Z.AI post-trained checkpoint sharing the
    underlying GLM-5.2 base. The official GLM-5 project lists 744B total
    and 40B active parameters, while the Hugging Face checkpoint metadata
    reports approximately 753B total; counting conventions differ by
    source and must not be conflated. Z.AI publishes FP8 and BF16 weight
    artifacts under a GLM-5.3-specific license, not the MIT license used
    for GLM-5.3-Flash. Publisher coding, cybersecurity and agent benchmark
    comparisons are not independent AI Lab evaluations. Actual context,
    serving configuration and hosted terms must be verified per route.
