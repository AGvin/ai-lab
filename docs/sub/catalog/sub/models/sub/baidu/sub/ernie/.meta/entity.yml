  identity_note: >-
    ERNIE is Baidu's foundation-model family. The represented ERNIE 5.0 and 5.1 entries are distinct
    trained-model identities; dated or descriptive Qianfan serving names are not automatically
    additional models. The concrete members own architecture, size and release facts. ERNIE 5.1
    preserves an explicit derived-from relationship to 5.0. Keep product features, hosted limits,
    partner models and the lifecycle of individual preview endpoints separate from the family.
