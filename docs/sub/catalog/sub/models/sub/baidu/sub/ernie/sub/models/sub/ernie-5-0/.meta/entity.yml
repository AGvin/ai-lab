entity:
  id: catalog/models/baidu/ernie/models/ernie-5-0
  type: model
  name: ERNIE 5.0
  identity_note: >-
    ERNIE 5.0 is Baidu's native unified multimodal model. Baidu's technical description reports 2.4
    trillion total parameters and an autoregressive framework integrating text, images, audio and
    video with sparse Mixture-of-Experts routing. Baidu records an updated release in January 2026;
    the technical article is dated 6 February 2026. The technical-publication date is not the
    model's initial release date. Total parameters do not imply an exact active count, and native
    multimodal architecture does not establish every Qianfan endpoint's input/output support. ERNIE
    5.1 is a separately trained derivative, not simply a serving alias.
  references:
    - type: article
      source:
        url: https://ernie.baidu.com/blog/posts/ernie5.0/
      purposes:
        - identification
        - research
      authority: official
