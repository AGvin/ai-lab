entity:
  id: catalog/models/sarvam-ai/saaras/saaras-v4
  type: model
  name: Saaras v4
  identity_note: >-
    Sarvam AI's released speech-recognition model uses the explicit hosted selector saaras:v4. Current API guidance identifies v4 as default, adding Global English to Indian English and 22 Indic languages. Its five modes are transcribe, translate, verbatim, translit and codemix; they are not five trained models. The August launch changelog's v3-default statement is historical. Current API limits and default routing are service facts, not immutable model architecture. A public weight license is not established by these hosted docs. Obtain recording/processing authorization, protect uploaded audio and transcripts, and verify names, numbers and critical translations. Explicitly select the required model/mode and validate on representative accents/noise; provider accuracy is not independently reproduced.
    Ownership/control-chain review is pending; no Russian-control assertion or adoption clearance.
