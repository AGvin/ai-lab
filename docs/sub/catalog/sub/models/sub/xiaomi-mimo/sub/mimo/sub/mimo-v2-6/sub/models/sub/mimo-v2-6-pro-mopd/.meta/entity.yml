  name: MiMo-V2.6-Pro-MOPD
  identity_note: >-
    MiMo-V2.6-Pro-MOPD is a distinct September 2026 Xiaomi MiMo MOPD2 post-trained model.
    Publisher-disclosed scale: about 1.02T total parameters. Scope: native multimodal text, image, video, audio.
    Distinct learned Pro weights after multi-teacher on-policy distillation incorporating repetition-specialized training; not merely a faster API mode. Claimed improvements are publisher observations. The released weights are MIT-labeled; source claims do not
    constitute independent hardware, benchmark or security evaluation.
