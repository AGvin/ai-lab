  identity_note: >-
    MiMo-V2.6-Flash-RL is a distinct September 2026 Xiaomi MiMo original reinforcement-learned model.
    Publisher-disclosed scale: about 311B total parameters. Scope: native multimodal text, image, video, audio.
    Original Flash RL policy with publisher-reported repeated tool calls. Flash-MOPD is a separately trained later checkpoint. The released weights are MIT-labeled; source claims do not
