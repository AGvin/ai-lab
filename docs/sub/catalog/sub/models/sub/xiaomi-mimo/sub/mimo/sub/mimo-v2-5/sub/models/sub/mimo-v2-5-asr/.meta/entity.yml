  name: MiMo-V2.5-ASR
  identity_note: >-
    Xiaomi MiMo's end-to-end speech-recognition checkpoint targets Mandarin, English, Chinese dialects and code-switched audio transcription. The publisher card labels it MIT and requires the separate MiMo-Audio-Tokenizer for its reference workflow. Its use-restriction notice explicitly says it is informational and does not amend the applicable model license. Do not inherit V2.5 language-model context limits, modalities or API retirement status. Use audio only with appropriate recording and processing authorization. Protect transcripts as potentially sensitive, verify names and critical facts, and assess errors on representative accents/noise. Pin and review the tokenizer, model and audio dependencies; no reference demo was executed. Ownership/control-chain review is pending; no Russian-control finding or eligibility clearance.
