  name: MiMo-V2.6-Flash-MOPD
  identity_note: >-
    MiMo-V2.6-Flash-MOPD is a distinct September 2026 Xiaomi MiMo MOPD2 post-trained model.
    Publisher-disclosed scale: about 311B total parameters. Scope: native multimodal text, image, video, audio.
    Distinct learned Flash weights after multi-teacher on-policy distillation targeting repetitive tool use; not a serving-only setting. Publisher results do not guarantee complete loop prevention. The released weights are MIT-labeled; source claims do not
    constitute independent hardware, benchmark or security evaluation.
