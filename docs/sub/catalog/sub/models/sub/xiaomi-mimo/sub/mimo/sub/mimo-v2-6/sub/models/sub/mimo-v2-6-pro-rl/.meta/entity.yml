  type: model
  name: MiMo-V2.6-Pro-RL
  identity_note: >-
    MiMo-V2.6-Pro-RL is a distinct September 2026 Xiaomi MiMo original reinforcement-learned model.
    Publisher-disclosed scale: about 1.02T total parameters. Scope: native multimodal text, image, video, audio.
    Original Pro RL policy. Xiaomi reports repetitive tool calls in certain agent harnesses; the later Pro-MOPD checkpoint has separately trained weights. The released weights are MIT-labeled; source claims do not
    constitute independent hardware, benchmark or security evaluation.
