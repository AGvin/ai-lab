  identity_note: >-
    PPLX Decider groups Perplexity's released decision checkpoints. V1, V1.1 and V1.2 use the Qwen3.8-27B backbone; Flash V1.2 is a smaller Qwen3.5-4B-based distilled checkpoint. They return typed decisions and calibrated probabilities rather than representing a general text-generation service.
