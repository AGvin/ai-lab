  name: DeepSeek-V3.2
  identity_note: >-
    DeepSeek's released V3.2 checkpoint supports reasoning with tool use and DeepSeek Sparse Attention. It is distinct from V3.2-Exp and V3.2-Speciale; Speciale's reasoning-only tool limitation must not be assigned to this checkpoint. The publisher licenses repository code and weights under MIT. Its updated message encoding and output parsing require integration-specific validation; the supplied parser does not recover malformed output. Benchmark superiority is publisher evidence, not independently reproduced here. Ultimate beneficial ownership and control rights remain unverified; provenance review is pending, not evidence of Russian ownership or adoption clearance.
    Use V3.2-specific encoding and robust output validation. The card states that its developer role is limited to search-agent scenarios and is not accepted by the official API. Sandbox tools and require authorization for consequential actions. Do not equate a hosted API alias with an immutable checkpoint revision.
