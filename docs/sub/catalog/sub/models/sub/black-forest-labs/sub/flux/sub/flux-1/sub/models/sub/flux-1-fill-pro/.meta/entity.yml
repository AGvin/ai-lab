  identity_note: >-
    FLUX.1 Fill [pro] is a separately offered BFL-hosted image inpainting and
    outpainting model introduced with FLUX.1 Tools in November 2024.
    It accepts text, an input image and a binary mask through the
    /v1/flux-pro-1.0-fill hosted route. It is not the separately released
    gated FLUX.1 Fill [dev] weight checkpoint or a general FLUX1.1
    text-to-image serving mode. The API endpoint does not establish a
    public model checkpoint, model-size, train-parent relationship or rights
    to run weights locally. Deprecated Canny/Depth endpoints are distinct;
    the BFL deprecation notice explicitly excludes Fill.
