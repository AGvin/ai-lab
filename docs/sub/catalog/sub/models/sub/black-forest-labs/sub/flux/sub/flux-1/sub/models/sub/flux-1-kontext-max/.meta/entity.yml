  identity_note: >-
    Black Forest Labs separately introduced FLUX.1 Kontext [max] on May 29, 2025 as a separately released premium hosted in-context image generation and editing model.
    Current BFL API uses the named /v1/flux-kontext-max route and the model remains listed
    for its API and Playground, with FLUX.2 recommended for new projects.
    Unlike [pro] and the open-weight Kontext [dev], [max] is a distinct BFL-hosted identity. A larger hosted tier does not establish an openly released checkpoint, parameter count, specific training parent or reproducible local runtime.
    API authentication, billing and service terms must be checked directly.
    Publisher quality, latency and stability claims are not independent benchmarks.
