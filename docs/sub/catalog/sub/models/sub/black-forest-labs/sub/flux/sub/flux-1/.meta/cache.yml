        identity_note: FLUX.1 is Black Forest Labs' first FLUX image-series grouping,
          including distinct schnell, dev, Krea, Kontext, Fill and Redux checkpoints
          and hosted Kontext [pro]/[max] and Fill [pro] offerings. It also indexes
          the separately introduced FLUX1.1 [pro] hosted text-to-image model; Ultra
          and Raw are FLUX1.1 serving modes rather than independent learned checkpoints.
          Redux is a dependent learned adapter, not a standalone base generator. Downloadable
          dev weights, hosted proprietary models and their respective licensing/usage
          rights are not interchangeable.
