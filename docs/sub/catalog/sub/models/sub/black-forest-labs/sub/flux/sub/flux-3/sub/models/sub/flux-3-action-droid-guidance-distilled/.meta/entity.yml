  type: model
  name: FLUX 3 Action DROID guidance-distilled
  identity_note: >-
    FLUX 3 Action DROID guidance-distilled is the separately released Black Forest Labs guidance-distilled separately trained DROID student.
    It is initialized from the fine-tuned DROID policy, trained under a frozen teacher, and released in the `variants/gd` BF16 directory. This learned student differs from root DROID weights. `variants/gd-fp8r` is a precision packaging of the same student, not a new model.
    Weights are gated under the FLUX Kommunity License; the Apache-2.0
    reference code and auxiliary encoders have separate license boundaries.
    BFL benchmark and speed numbers are publisher evidence, not AI Lab tests.
    No robot-deployment safety certification or local inference is established.
