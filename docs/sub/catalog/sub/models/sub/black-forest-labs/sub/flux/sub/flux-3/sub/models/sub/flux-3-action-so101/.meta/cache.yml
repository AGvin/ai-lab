        name: FLUX 3 Action SO-101
        identity_note: FLUX 3 Action SO-101 is the separately released Black Forest
          Labs SO-101 embodiment fine-tuned policy. It is fine-tuned separately from
          the FLUX 3 Action adaptation base for the SO-101 observation and robot action
          interface, released as a gated LeRobot model. SO-101 action/state normalization,
          camera layout, hardware interfaces and safety bounds are distinct from DROID.
