  identity_note: >-
    Black Forest Labs independently introduced FLUX1.1 [pro] on October 2, 2024 as
    a proprietary API-hosted text-to-image model distinct from FLUX.1 [pro] and
    the separate open-weight FLUX.1 [dev]/[schnell] checkpoints.
    BFL's API identifies the model at /v1/flux-pro-1.1. Ultra and Raw are
    additional generation modes of FLUX1.1 [pro], not established
    separately trained model checkpoints; /v1/flux-pro-1.1-ultra is a mode endpoint.
    No local weights, training-parent lineage, parameter count or independent
    performance benchmarks have been established. API access, output and
    commercial rights follow current hosted service contracts.
