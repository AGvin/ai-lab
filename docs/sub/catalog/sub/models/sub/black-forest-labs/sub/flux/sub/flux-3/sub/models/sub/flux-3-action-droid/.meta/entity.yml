entity:
  id: catalog/models/black-forest-labs/flux/flux-3/models/flux-3-action-droid
  type: model
  name: FLUX 3 Action DROID
  identity_note: >-
    FLUX 3 Action DROID is the separately released Black Forest Labs DROID embodiment fine-tuned policy.
    It is fine-tuned from the FLUX 3 Action 7B adaptation base for the DROID robot data/observation/action convention. DROID camera/state/action preprocessing and a matching action head are required; adapting this policy is not evidence of safe use on a different physical robot.
    Weights are gated under the FLUX Kommunity License; the Apache-2.0
    reference code and auxiliary encoders have separate license boundaries.
    BFL benchmark and speed numbers are publisher evidence, not AI Lab tests.
    No robot-deployment safety certification or local inference is established.
