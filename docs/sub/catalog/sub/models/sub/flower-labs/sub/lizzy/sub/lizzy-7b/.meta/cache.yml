        name: Lizzy 7B
        identity_note: Flower Labs' 7B-class decoder-only English assistant targets
          British English and UK-oriented knowledge. The publisher declares Apache-2.0
          for the base checkpoint and distinguishes original BF16 Safetensors from
          GGUF quantizations. Its up-to-65,536-token context depends on runtime and
