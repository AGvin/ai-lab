entity:
  id: catalog/models/minimax/h3
  type: model-family
  name: MiniMax H3
  identity_note: >-
    MiniMax H3 is a released audiovisual model family/system, not one concrete checkpoint. The publisher distinguishes FL2VA and Ref2VA base checkpoints and their encoder/VAE dependencies. Context-IR and Regenerate-2K are not included in the open release; local base output does not reproduce the full hosted 2K workflow. The encoder uses Qwen3-VL-32B, requiring separate upstream provenance/license consideration. H3 uses a custom community license naming Nanonoble Pte. Ltd.; it excludes EU, UK, Republic of Korea and USA and includes commercial authorization, branding and downstream safeguards. Exact terms govern; this is not MIT/Apache or worldwide deployment clearance. Ownership/control-chain review remains pending. No weights, code, inference or license acceptance.
  references:
    - type: documentation
      source:
        url: https://huggingface.co/MiniMaxAI/MiniMax-H3
      purposes: [identification, research]
      authority: official
    - type: documentation
      source:
        url: https://huggingface.co/MiniMaxAI/MiniMax-H3/blob/main/LICENSE
      purposes: [identification, research]
      authority: official
    - type: documentation
      source:
        url: https://www.minimax.io/news/minimax-h3-open-source
      purposes: [identification, research]
      authority: official
  relations:
    - type: produced-by
      target: catalog/producers/m/minimax
