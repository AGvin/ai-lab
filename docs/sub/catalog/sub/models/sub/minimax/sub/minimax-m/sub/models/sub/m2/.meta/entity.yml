entity:
  id: catalog/models/minimax/minimax-m/models/m2
  type: model
  name: MiniMax M2
  identity_note: >-
    MiniMax's released M2 text-generation checkpoint targets coding and agentic work. The publisher reports MoE with 230B total and 10B activated parameters; active count is not storage or serving-memory demand. It is distinct from M3, hosted MiniMax products and distribution artifacts. Although the license heading says MIT, its added clause requires MiniMax M2 interface branding above 100 million monthly active users or USD 30 million annual recurring revenue. The model card labels it modified-mit; do not describe it as unmodified MIT. Benchmarks are publisher evidence, not reproduced here. Ultimate beneficial ownership and control rights remain unverified; provenance review is pending, not evidence of Russian ownership or adoption clearance.
    Inspect and revision-pin custom code before using loaders that require trust_remote_code. Validate chat/tool parsing and isolate generated code or tool execution. Hosting, API prices and third-party deployment support need separate current verification.
  references:
    - type: registry
      source:
        url: https://huggingface.co/MiniMaxAI/MiniMax-M2
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://github.com/MiniMax-AI/MiniMax-M2/blob/main/LICENSE
      purposes:
        - research
      authority: official
  relations:
