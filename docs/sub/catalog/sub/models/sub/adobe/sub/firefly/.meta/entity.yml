  type: model-family
  name: Adobe Firefly
  identity_note: >-
    Adobe Firefly is Adobe's family of generative-media models. This model-family node groups the
    represented Adobe-trained models; the Firefly application also offers models produced by other
    companies. Choose a concrete Adobe model and the product surface separately. Model release
    status, app features, partner models, custom-model workflows, API support, credits and
    commercial-use conditions have separate scopes. Adobe's commercial-safety positioning is not a
    guarantee about every generated asset.
