entity:
  id: catalog/models/adobe/firefly/models/image-model-5
  type: model
  name: Firefly Image Model 5
  identity_note: >-
    Firefly Image Model 5 is Adobe's distinct image-generation and editing model. It entered public
    beta in October 2025, and Adobe explicitly announced general availability on 19 March 2026.
    Adobe's original specification describes native 4-megapixel output, not 4K output. Native image
    generation and prompt-based editing provide a material distinction from the earlier represented
    image models. Product-specific editing tools, API availability, plans, custom-model training and
    partner models remain separate; check current capabilities and input rights rather than assuming
    parity across surfaces.
