        type: model
        name: Firefly Video Model
        identity_note: Firefly Video Model is Adobe's video-generation model, made
          generally available on 24 April 2025 after a public beta. It generates video
          from text or image inputs and remains distinct from partner video models
          offered through Firefly. Output resolution, duration, frame rate and controls
          must be tied to a documented workflow. The current style-preset guide describes
          540p, 720p or 1080p with a five-second, 24-FPS workflow; these are surface
          settings, not universal limits on every API or integration.
