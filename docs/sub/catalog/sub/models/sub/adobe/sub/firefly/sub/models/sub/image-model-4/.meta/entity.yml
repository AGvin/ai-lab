  type: model
  name: Firefly Image Model 4
  identity_note: >-
    Firefly Image Model 4 is Adobe's image-generation model made generally available on 24 April
    2025. Adobe positions it for fast ideation and everyday image work, with outputs up to 2K in the
    launch documentation. Compare output fidelity on the actual prompts and reference images
    required by the project. Current model selection, settings, API support, credits and rights
    checks belong to the chosen Adobe product surface; Image Model 4 is a separate identity from 4
    Ultra and 5.
