  name: Firefly Image Model 4 Ultra
  identity_note: >-
    Firefly Image Model 4 Ultra is Adobe's separately named image-generation model, generally
    available from 24 April 2025. Adobe positions Ultra for detailed, complex scenes and
    photorealistic results. The Ultra label does not establish a universal quality advantage, a
    disclosed parameter count or a fixed credit cost. Evaluate the actual task and selected Firefly
    surface, including rights to supplied references and review of generated assets.
