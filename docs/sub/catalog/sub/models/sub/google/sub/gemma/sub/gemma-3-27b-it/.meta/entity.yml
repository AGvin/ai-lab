      source:
        url: https://huggingface.co/google/gemma-3-27b-it
      purposes: [identification, research]
      authority: official
    - type: documentation
      source:
        url: https://ai.google.dev/gemma/terms
      purposes: [identification, research]
      authority: official
  relations:
