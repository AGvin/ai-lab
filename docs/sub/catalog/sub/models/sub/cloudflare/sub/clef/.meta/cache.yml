        id: catalog/models/cloudflare/clef
        type: model-family
        name: Clef
        identity_note: Clef is Cloudflare's released family of decision models. It
          groups the independently identified Clef, Clef-flash and Clef-omni models,
          which score allowed answers to typed questions rather than produce unconstrained
          text responses. Define the allowed outcomes, select a concrete member and
          calibrate the action thresholds for the task. API compatibility, hosted
          context, media processing, weight availability and runtime requirements
          have separate scopes. A probability or a well-formed answer is not authorization
          to act.
        references:
