        id: catalog/models/cloudflare/clef/models/clef-flash
        type: model
        name: Clef-flash
        identity_note: Clef-flash is Cloudflare's concrete 9B decision model, released
          on 1 October 2026 and post-trained from Qwen/Qwen3.5-9B. It scores allowed
          answers to typed questions from text, structured state and supported visual
          inputs, and is positioned by Cloudflare for lower-latency decisions. The
          9 October hosted change reduced the advertised context from 64K to 24K without
          changing the weights; the current Workers AI page specifies 24,576 tokens.
          Cloudflare separately describes up to 256K for self-hosted weights. Neither
          value guarantees practical memory fit or complete input retention in a chosen
          runtime.
