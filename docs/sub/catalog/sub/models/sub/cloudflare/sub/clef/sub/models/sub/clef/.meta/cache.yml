        id: catalog/models/cloudflare/clef/models/clef
        type: model
        name: Clef
        identity_note: Clef is Cloudflare's concrete 27B decision model, released
          on 1 October 2026 and post-trained from Qwen/Qwen3.8-27B. It uses a joint
          schema head to score predefined answers from text, structured state and
          supported visual inputs, without free-form text generation. The Apache 2.0
          release includes the backbone, joint schema head, processor and model-specific
          implementation. Workers AI currently documents a 65,536-token context; questions
          and media consume that budget and long text state can be truncated. Validate
          retained evidence and decision thresholds before acting on a probability.
