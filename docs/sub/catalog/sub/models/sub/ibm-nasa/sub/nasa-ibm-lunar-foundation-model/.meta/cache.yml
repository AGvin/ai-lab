        id: catalog/models/ibm-nasa/nasa-ibm-lunar-foundation-model
        type: model
        name: NASA-IBM Lunar Foundation Model
        aliases:
        - NASA-IBM LFM
        identity_note: NASA-IBM Lunar Foundation Model is a multimodal, multi-resolution
          lunar remote-sensing foundation model jointly released by NASA and IBM.
          The current model card describes a ViT-B encoder-decoder pretrained from
          scratch on SomBench, with nearly two million co-registered tile bundles
          spanning 11 modalities at 1 m/pixel and 100 m/pixel scales. The released
          checkpoint is Apache-2.0. Downstream crater, irregular-mare-patch, and ice-prospectivity
          models are separate task adaptations rather than aliases of this pretrained
          model.
