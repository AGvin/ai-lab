entity:
  id: catalog/models/cohere-labs
  type: model-producer-view
  name: Cohere Labs models
  identity_note: >-
    This producer view organizes the represented research models stewarded by Cohere Labs. Aya is
    the represented family, with separate Expanse, Vision and Tiny Aya series. Use a concrete model
    page to compare capability, language coverage, weight licensing and current hosted access.
    Cohere Labs is the research organization; a repository namespace or an API route alone does not
    determine model authorship.
