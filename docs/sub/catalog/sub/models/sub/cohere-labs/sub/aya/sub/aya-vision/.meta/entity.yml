entity:
  id: catalog/models/cohere-labs/aya/aya-vision
  type: model-series
  name: Aya Vision
  identity_note: >-
    Aya Vision is the multilingual vision-language series released on 4 March 2025. Its represented
    8B and 32B model identities accept text and images and produce text. The two sizes have
    different language-model parents: Command R7B for Vision 8B and Aya Expanse 32B for Vision 32B.
    Their model-specific lineage, processor behavior and current hosted status must remain distinct.
