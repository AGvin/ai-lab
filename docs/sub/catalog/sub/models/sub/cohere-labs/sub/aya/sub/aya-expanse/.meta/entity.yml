  type: model-series
  name: Aya Expanse
  identity_note: >-
    Aya Expanse is the multilingual text-model series released on 24 October 2024. Its represented
    8B and 32B models are distinct trained identities within Aya. Compare the concrete models'
    context and deployment needs separately. Their downloadable weights and Cohere API routes have
    different lifecycle and licensing surfaces; the 8B route retirement does not erase the weight
    release.
