entity:
  id: catalog/models/cohere-labs/aya/aya-vision/models/aya-vision-32b
  type: model
  name: Aya Vision 32B
  identity_note: >-
    Aya Vision 32B is Cohere Labs' nominal 32B-class multilingual vision-language model, released on
    4 March 2025. The card documents text/image input, text output, 23 languages and a 16K context.
    Its language component is explicitly Aya Expanse 32B. The current c4ai-aya-vision-32b Chat route
    is live with 16K context and a 4K maximum output. Use the matching image processor and chat
    template; the model's size label is not an exact sum of every tensor in a multimodal
    distribution.
