  type: model
  name: Aya Expanse 8B
  identity_note: >-
    Aya Expanse 8B is Cohere Labs' 8-billion-parameter multilingual text model, released on 24
    October 2024. Its official card documents text input/output, 23 supported languages and an 8K
    context window. The official weights remain a research distribution with gated access and
    CC-BY-NC-4.0 terms. The Cohere route c4ai-aya-expanse-8b retired on 4 April 2026, so a
    historical Chat example does not establish current hosted availability.
