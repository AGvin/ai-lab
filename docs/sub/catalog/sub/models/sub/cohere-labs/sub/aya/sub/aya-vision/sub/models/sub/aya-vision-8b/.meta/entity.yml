entity:
  id: catalog/models/cohere-labs/aya/aya-vision/models/aya-vision-8b
  type: model
  name: Aya Vision 8B
  identity_note: >-
    Aya Vision 8B is Cohere Labs' nominal 8B-class multilingual vision-language model, released on 4
    March 2025. The card documents text/image input, text output, 23 languages and a 16K context.
    Its language component is based on Command R7B 12-2024 and further post-trained using the Aya
    Expanse recipe. The Cohere c4ai-aya-vision-8b route retired on 4 April 2026; the official weight
    identity remains available under its access conditions. Use the matching image processor and
    chat template; the model's size label is not an exact sum of every tensor in a multimodal
    distribution.
