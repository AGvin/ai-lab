entity:
  id: catalog/models/cohere-labs/aya/tiny-aya
  type: model-series
  name: Tiny Aya
  identity_note: >-
    Tiny Aya is the compact multilingual text-model series introduced on 17 February 2026. The
    represented instruction-tuned models are Global, Earth, Fire and Water. Global balances
    performance across regions; the three regional releases combine regional posttraining with the
    global model through a documented merge. The separate original 8K and 32K pretrained bases and two differently supervised reasoning
    checkpoints are represented alongside the four original Global and regional models. Quantizations
    and hosted aliases are artifacts/routes, not new learned model identities.
