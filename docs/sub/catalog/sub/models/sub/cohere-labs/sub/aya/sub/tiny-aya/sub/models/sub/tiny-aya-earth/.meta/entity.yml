entity:
  id: catalog/models/cohere-labs/aya/tiny-aya/models/tiny-aya-earth
  type: model
  name: Tiny Aya Earth
  identity_note: >-
    Tiny Aya Earth is a region-specialized instruction-tuned 3.35-billion-parameter multilingual
    text model developed by Cohere and Cohere Labs. Its current documentation covers 70 languages
    and an 8K context, with emphasis on West Asian and African language tasks. The Cohere
    tiny-aya-earth Chat route is currently live; its table lists an 8K maximum output separately
    from the context figure. The official gated weights use CC-BY-NC-4.0 with acceptable-use terms.
    Advertised language coverage and small size do not guarantee uniform task quality or fit on
    every device.
