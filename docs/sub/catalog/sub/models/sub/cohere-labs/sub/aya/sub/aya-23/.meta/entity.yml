entity:
  id: catalog/models/cohere-labs/aya/aya-23
  type: model-series
  name: Aya 23
  identity_note: >-
    Aya 23 is the older multilingual text-model release series of 23 May 2024, containing
    separate instruction-tuned 8B and 35B research-weight checkpoints with 23-language coverage
    and 8,192-token context. The CC-BY-NC-4.0 weights are gated and subject to Cohere Labs
    acceptable-use conditions. Do not confuse this series with Aya Expanse, Aya Vision, API
    provider availability, a separately released base checkpoint, or a documented exact training parent.
