entity:
  id: catalog/models/cohere-labs/aya
  type: model-family
  name: Aya
  identity_note: >-
    Aya is the multilingual research-model family led by Cohere Labs. The represented branches are
    Aya Expanse for text, Aya Vision for text-and-image understanding, and Tiny Aya for compact
    multilingual text models. Family membership does not make member language coverage, modality,
    context or access interchangeable. Select a concrete trained model, and distinguish its weights
    from a provider route, quantization, dataset or evaluation suite.
