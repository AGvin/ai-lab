  type: model
  name: Aya Expanse 32B
  identity_note: >-
    Aya Expanse 32B is Cohere Labs' 32-billion-parameter multilingual text model, released on 24
    October 2024. Its model card documents text input/output, 23 supported languages and a 128K
    context window. The live Cohere c4ai-aya-expanse-32b route documents a 4K maximum output, which
    is separate from its 128K context. Downloaded weights require their own license/access checks
    and a runtime sized for the selected precision and context.
