        name: Aya
        identity_note: Aya is the multilingual research-model family led by Cohere
          Labs. The represented branches are Aya 101 (the original 2024 Apache-2.0
          13B text model), Aya 23 (the historical 2024 multilingual text series),
          Aya Expanse for text, Aya Vision for text-and-image understanding, and Tiny
