  identity_note: >-
    Hugging Face's Smol Models Research team publishes this 3B instruction/reasoning checkpoint separately from SmolLM3-3B-Base. The card declares Apache-2.0, six natively supported languages and decoder-only GQA/NoPE. It distinguishes trained 64K context from up-to-128K YaRN extrapolation; think/no-think controls are modes of one checkpoint, not extra trained-model identities. Pin the revision and validate chat/reasoning-mode controls for the selected runtime. Extended context is not independently validated here. Isolate tool calls and generated code, and verify output facts. Existing corporate-transition notes are not an ownership-clearance finding. Publisher capability/benchmark claims were not independently reproduced. Ownership/control-chain review is incomplete; no Russian-control finding or adoption clearance is established.
