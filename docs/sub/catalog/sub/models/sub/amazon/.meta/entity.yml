entity:
  id: catalog/models/amazon
  type: model-producer-view
  name: Amazon models
  identity_note: >-
    Navigation view for Amazon Nova, Amazon Titan and Strands Decider. Amazon Web Services remains the
    canonical producer; this view is not another organization. Nova and Titan are model families,
    while Strands Decider checkpoints perform typed decisions. Bedrock access and the Strands runtime
    are separate from trained model identity. Availability must be established for the particular
    model and route.
