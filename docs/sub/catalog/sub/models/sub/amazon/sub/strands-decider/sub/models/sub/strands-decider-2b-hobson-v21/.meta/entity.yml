entity:
  id: catalog/models/amazon/strands-decider/models/strands-decider-2b-hobson-v21
  type: model
  name: Strands Decider 2B Hobson V21
  identity_note: >-
    Concrete Hobson V21 checkpoint with a Qwen3.5-2B-Base LoRA adapter and option-scoring head; it is
    not the later Qwen v1 recipe. Confidence calibration was fitted on held-out short tasks and needs
    evaluation on the target workflow. Optional Qwen vision was not trained on images, and missing
    image inputs can still yield confident wrong answers. The recorded base revision was inferred
    rather than pinned during training. Pin artifacts and runtime separately; the local server has no
    authentication. Runtime state is truncated by default; strict-window mode rejects oversize input.
