        type: model
        name: Amazon Nova Multimodal Embeddings
        identity_note: Nova 2 embedding identity with Bedrock route amazon.nova-2-multimodal-embeddings-v1:0.
          Output is vectors, not generated text. The guide limits a model input to
          8K tokens or 30 seconds of audio/video; longer media uses asynchronous segmentation.
          Supported dimensions are 256, 384, 1024 and 3072. Corpus/query embedding
          purpose and synchronous single-input versus asynchronous segmented requests
          are operational choices, not additional models.
