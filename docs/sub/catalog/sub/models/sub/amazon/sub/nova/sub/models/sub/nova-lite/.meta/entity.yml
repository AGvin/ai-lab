entity:
  id: catalog/models/amazon/nova/models/nova-lite
  type: model
  name: Amazon Nova Lite
  identity_note: >-
    Distinct first-generation Nova trained identity with Bedrock route amazon.nova-lite-v1:0. The
    current card marks it Active and lists 300K context with a 10K output maximum. It accepts text,
    images and video and produces text. Visual input support does not mean image or video generation.
    Converse and Invoke support and regional availability belong to the hosted access contract.
