        type: model
        name: Amazon Nova 2.5 Sonic
        identity_note: 'Released successor to Nova 2 Sonic with the same documented
          bidirectional streaming API surface. Official sources conflict on context:
          the October 5, 2026 announcement says 256K tokens, while the current Nova
          product page says up to 1M. No single unqualified capacity is asserted here.
          The service card excludes real-time speech-to-speech translation and customer
          fine-tuning. System prompts and configurations are customization controls,
          and migration still needs workload retesting.'
