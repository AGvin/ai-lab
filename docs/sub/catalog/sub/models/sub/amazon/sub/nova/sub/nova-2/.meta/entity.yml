entity:
  id: catalog/models/amazon/nova/nova-2
  type: model-series
  name: Amazon Nova 2
  identity_note: >-
    Nova generation within the AWS-produced Nova family. Its initial documentation names Lite, Sonic
    and Multimodal Embeddings; the launch announcement separately identifies Nova 2 Pro as Preview.
    Text generation, speech-to-speech and vector embeddings have different contracts. The series has
    no single inherited modality, output type, context limit or access entitlement.
