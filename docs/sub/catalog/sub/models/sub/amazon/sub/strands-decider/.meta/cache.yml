        id: catalog/models/amazon/strands-decider
        type: model-family
        name: Strands Decider
        identity_note: AWS Strands model lineage with published adapters and option-scoring
          heads, separate from the Strands SDK and inference package. noul, choice
          and score select or rate supplied alternatives rather than generating free-form
          answers. Public checkpoints define trained identities; mirrors, seeds and
          code releases do not. Confidence calibration needs target-traffic evaluation.
          Qwen vision is optional and not image-trained; the released Gemma deciders
          are text-only and require the repository runtime with Gemma support. Runtime
          state is truncated by default; strict-window mode rejects oversize input.
