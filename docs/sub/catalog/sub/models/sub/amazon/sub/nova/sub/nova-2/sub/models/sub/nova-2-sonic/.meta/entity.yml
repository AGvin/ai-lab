  type: model
  name: Amazon Nova 2 Sonic
  identity_note: >-
    Speech-to-speech model identified as amazon.nova-2-sonic-v1:0. The current Bedrock card marks it
    Active and lists a 1M-token context and 64K maximum output. It uses
    InvokeModelWithBidirectionalStream, not ordinary Converse or Invoke requests. Connections have an
    eight-minute session limit independent of context size. The May 2026 automatic refresh is an
    in-place update, not an additional model identity.
