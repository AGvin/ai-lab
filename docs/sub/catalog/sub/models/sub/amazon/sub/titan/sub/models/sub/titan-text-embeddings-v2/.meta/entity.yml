entity:
  id: catalog/models/amazon/titan/models/titan-text-embeddings-v2
  type: model
  name: Amazon Titan Text Embeddings V2
  identity_note: >-
    Distinct Titan V2 embedding identity with Active Bedrock route amazon.titan-embed-text-v2:0. Input
    is bounded by 8192 tokens or 50000 characters. Dimensions are 1024 by default, 512 or 256;
    normalization defaults to true. A binary-only request omits the top-level embedding field and uses
    embeddingsByType. V2 generates retrieval vectors rather than text; language and cross-language
    quality need workload validation.
