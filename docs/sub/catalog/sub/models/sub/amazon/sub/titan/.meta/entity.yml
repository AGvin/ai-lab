entity:
  id: catalog/models/amazon/titan
  type: model-family
  name: Amazon Titan
  identity_note: >-
    AWS-pretrained model family, distinct from the Bedrock hosting service. Its text and multimodal
    embedding identities have different request schemas, input limits and vector dimensions. This page
    does not infer that every historically documented Titan model remains currently accessible. Family
    membership does not transfer image generation, fine-tuning or a single embedding schema across
    members.
  references:
    - type: documentation
      source:
        url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-models.html
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan-embed-text.html
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-multiemb-models.html
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle-legacy.html
      purposes:
        - identification
        - research
      authority: official
  relations:
    - type: produced-by
      target: catalog/producers/a/amazon-web-services
    - type: has-member
      target: catalog/models/amazon/titan/models/titan-embeddings-g1-text
    - type: has-member
      target: catalog/models/amazon/titan/models/titan-text-embeddings-v2
    - type: has-member
      target: catalog/models/amazon/titan/models/titan-multimodal-embeddings-g1
