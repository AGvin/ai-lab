entity:
  id: catalog/models/amazon/nova/models/nova-micro
  type: model
  name: Amazon Nova Micro
  identity_note: >-
    Distinct first-generation Nova trained identity with Bedrock route amazon.nova-micro-v1:0. The
    current card marks it Active and lists 128K context with a 10K output maximum. It accepts text and
    produces text. Micro does not inherit multimodal or document-file input support from Lite and Pro.
    Converse and Invoke support and regional availability belong to the hosted access contract.
