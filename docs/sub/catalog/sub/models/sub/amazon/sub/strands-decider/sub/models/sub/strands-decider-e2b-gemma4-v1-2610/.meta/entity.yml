  name: Strands Decider E2B Gemma4 v1-2610
  identity_note: >-
    Released strands-decider-E2B-gemma4-v1-2610 adapter and decision head on google/gemma-4-E2B-it.
    The three-run combination is a trained model identity, not a runtime package or a mirror. It uses
    text only and requires the repository code with Gemma support, which the cited card says is not
    yet in PyPI. Model size labels do not establish memory fit or inherited base modalities.
    Short-task confidence calibration must be tested on the target questions. E2B needs the documented
    eager-attention workaround for cached-state scoring; pre-fix Decision Index results may be
    affected. Runtime state is truncated by default; strict-window mode rejects oversize input.
