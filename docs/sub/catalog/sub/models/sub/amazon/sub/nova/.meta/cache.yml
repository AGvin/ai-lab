        id: catalog/models/amazon/nova
        type: model-family
        name: Amazon Nova
        identity_note: AWS model family with generation-specific and task-specific
          members. Micro accepts text, Lite and Pro also accept images and video,
          Sonic performs conversational speech, and Multimodal Embeddings produces
          vectors. These roles do not imply common modalities, context limits or APIs.
          Nova 2 Pro retains its source-backed preview boundary; Bedrock and Forge
          are services rather than family members.
