    Perplexity API Platform Skills is the official repository-backed collection for API migration and search-development workflows. Its portable skill files and plugin packaging are distinct from the public Computer Skills Marketplace. Perplexity's Apache-2.0 repository distributes API-development skill guidance and plugin packaging, separate from the Computer Skills Marketplace. The optional public docs MCP server requires no API key; this does not establish paid search/API entitlement. Inspect scripts and authorize application migration or network calls independently.