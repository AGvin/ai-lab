entity:
  id: catalog/agent-skills/collections/sentry-for-ai
  type: skill-collection
  name: Sentry for AI
  identity_note: >-
    Sentry's public canonical skill-source library for instrumenting and
    debugging applications with Sentry through coding assistants. The
    source repository is not an installable plugin; versioned client-specific
    agent plugins and the portable Agent Plugin are generated distributions
    from this source. The reference library and hosted MCP integration
    support these workflows. It is separate from internal Sentry Skills
    and the hosted observability service.
