entity:
  id: catalog/agent-skills/collections/supabase-agent-skills
  type: skill-collection
  name: Supabase Agent Skills
  identity_note: >-
    Supabase Agent Skills is Supabase’s official collection of instructions and supporting material for
    Supabase development and PostgreSQL operational guidance. General PostgreSQL advice and
    Supabase-specific workflows remain distinguishable within the collection; individual skill folders
    are not automatically separate products. The repository provides skills CLI and Claude Code plugin
    installation routes. Those are distribution surfaces of the same collection. Check the current
    inventory, skill revision, supported client and included scripts before installation. Advice must be
    matched to the application’s schema, PostgreSQL version and Supabase features; publication is not a
    blanket applicability or safety guarantee. The repository is MIT-licensed. Skills are separate from
    the hosted Supabase platform, CLI, MCP server and database credentials. Installing them does not
    grant a project connection or authorize a migration. Use scoped database access, inspect generated
    SQL and review changes before applying them. Hosted service contracting and data-processing terms
    belong to the applicable Supabase order, independently of this instruction package.
