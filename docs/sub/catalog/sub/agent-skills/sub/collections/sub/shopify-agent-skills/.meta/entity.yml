entity:
  id: catalog/agent-skills/collections/shopify-agent-skills
  type: skill-collection
  name: Shopify Agent Skills
  identity_note: >-
    Shopify Agent Skills is Shopify’s first-party collection of instructions and supporting material for coding agents working with Shopify APIs and development tools. It covers areas such as Admin and Storefront APIs, customer accounts, Functions, Hydrogen, Liquid and extension interfaces. Individual skill folders are selectable content within this collection. The repository is generated from an upstream source and does not accept direct pull requests. Skills include documentation-search and validation scripts, API-specific configuration and schema or reference assets. That Shopify-specific layout is not a universal Agent Skills format requirement. Use the current repository’s installation instructions: its documented CLI is npx skill, whose name must not be silently replaced with a different tool. Installing instructions or passing a validation script does not authorize a merchant store, prove compatibility with every API version or replace app permission checks. Inspect the selected scripts, pin relevant API/schema versions and grant scoped credentials separately. The inspected repository root did not supply a blanket license document; do not infer unrestricted redistribution from public visibility. Shopify’s hosted commerce services, SDKs and third-party extensions retain their own boundaries. Shopify's distribution is generated upstream and includes API-specific search/validation scripts, schemas and instructions. Its documented installer is npx skill, not an assumed interchangeable CLI. No repository-root license was observed; public visibility does not grant blanket copying rights. Installation does not grant merchant-store or API permissions.
  references:
    - type: repository
      source:
        url: https://github.com/Shopify/agent-skills
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://github.com/Shopify/agent-skills/blob/6b9ed0552d5116ee33d0e211dfa6681f2f5bdffe/README.md
      purposes: [identification, research]
      authority: official
  relations:
