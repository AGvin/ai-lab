    entity:
      effective:
        schema: default
        id: catalog/agent-skills/collections/mongodb-agent-skills
        type: skill-collection
        name: MongoDB Agent Skills
        identity_note: MongoDB Agent Skills is MongoDB's official portable instruction
          collection for agent-assisted database work, including query and schema
          design, indexing, optimization, Atlas Search and Vector Search. The same
          collection is distributed through the mongodb-atlas plugin, the self-managed
          mongodb plugin and standalone skills installation. The Atlas route connects
          to MongoDB-hosted MCP using OAuth; the self-managed route runs an MCP server
          locally for the user's deployment. Instruction files alone do not configure
          a live connection or grant credentials. The repository uses Apache 2.0.
          That license concerns the collection, not every connected database, hosted
          service or coding agent. Inspect the current skills and client compatibility
          and configure database access for the intended deployment. A skill's advice
          does not verify permissions, and each skill directory or plugin manifest
          does not become a separate product identity.
        references:
        - type: repository
          source:
            url: https://github.com/mongodb/agent-skills
          purposes:
          - identification
          - research
          authority: official
        - type: documentation
          source:
            url: https://www.mongodb.com/docs/agent-skills/
          purposes:
          - identification
          - research
          authority: official
        relations:
        - type: produced-by
          target: catalog/producers/m/mongodb
