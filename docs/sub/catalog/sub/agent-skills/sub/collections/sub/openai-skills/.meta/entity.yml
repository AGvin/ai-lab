      source:
        url: https://github.com/openai/skills
      purposes:
        - identification
        - research
      authority: official
      note: Deprecated repository retained as the source of the selected historical/system skill.
    - type: repository
      source:
        url: https://github.com/openai/plugins
      purposes:
        - research
      authority: official
      note: Current successor repository for Codex plugin examples as directed by openai/skills.
    - type: documentation
      source:
        url: https://github.com/openai/skills/blob/49f948faa9258a0c61caceaf225e179651397431/README.md
      purposes: [identification, research]
      authority: official
  relations:
