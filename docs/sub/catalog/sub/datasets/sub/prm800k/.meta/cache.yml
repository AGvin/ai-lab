        name: PRM800K
        identity_note: OpenAI's May 2023 published process-supervision corpus of human
          step-level correctness feedback on model-generated mathematical solutions
          to original MATH competition problems. Distinct from the 12,500-question
          MATH source, the selected MATH-500 test subset, a trained process reward
          model or evaluation software. The original code/data repository is archived.
        references:
