          - research
          authority: official
          note: Original OpenAI May 31, 2023 publication and distinct process-supervision
            dataset release.
        - type: repository
          source:
            url: https://github.com/openai/prm800k
          purposes:
          - identification
          - research
          authority: official
          note: Original released source dataset, Git LFS data files and labeling
            instructions; repository archived in 2026.
        - type: paper
          source:
            url: https://arxiv.org/abs/2305.20050
          purposes:
          - identification
          - research
          authority: upstream
          note: Original Let's Verify Step by Step research paper and data collection
            methodology.
        - type: repository
          source:
            url: https://github.com/openai/prm800k/tree/main/prm800k/data
          purposes:
          - research
          authority: official
          note: Original phase1/phase2 train/test JSONL payloads tracked with Git
            LFS.
        - type: repository
          source:
            url: https://github.com/openai/prm800k/blob/main/LICENSE
          purposes:
          - research
          authority: official
          note: MIT repository software/documentation license; underlying third-party
