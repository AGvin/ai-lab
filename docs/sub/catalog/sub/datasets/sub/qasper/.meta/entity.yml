entity:
  id: catalog/datasets/qasper
  type: dataset
  name: Qasper
  aliases:
    - QASPER
    - Question Answering over Scientific Research Papers
  identity_note: >-
    Ai2's original 2021 Qasper dataset contains 5,049 information-seeking
    questions about 1,585 full-text NLP research papers. A question writer
    sees only a title and abstract, while another person answers from the
    full text and supplies evidence. Publisher builder 0.3.0 records 888
    training, 281 validation and 416 test papers, not those counts of
    questions. The publisher Hub card declares CC BY 4.0 for its dataset,
    not independently for all underlying third-party S2ORC paper text.
    Distinct from DROP, the SCROLLS suite, Longformer baseline software,
    model checkpoints and live evaluation results.
  references:
    - type: official-site
      source:
        url: https://allenai.org/open-data
      purposes: [identification, research]
      authority: official
      note: "Ai2's current original Qasper open-data catalog entry."
