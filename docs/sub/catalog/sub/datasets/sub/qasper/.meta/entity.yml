      source:
        url: https://huggingface.co/datasets/allenai/qasper
      purposes: [identification, research]
      authority: official
      note: "Original Ai2-managed dataset card, 5,049 questions over 1,585 papers, evidence annotations and CC BY 4.0 metadata."
    - type: paper
