        id: catalog/datasets/mlperf-end-to-end-rag-inference
        type: dataset
        name: MLPerf End-to-End RAG Inference
        identity_note: MLPerf End-to-End RAG Inference is MLCommons' benchmark for
          measuring a complete retrieval-augmented question-answering pipeline, released
          within MLPerf Inference v6.1. The benchmark contains database-ingestion
          (e2e-rag-db) and question-answering (e2e-rag-qna) workloads. The initial
          design uses a frozen FRAMES query/corpus snapshot and multiple model/pipeline
          components, so it is distinct from FRAMES itself or any one model, vector
          database or serving framework. Reference models, corpus preparation, hop
          limits, accuracy/performance metrics and compliance checks are release-specific.
          Vendor submissions report the exact pipeline and system configuration tested;
          they do not establish a universal RAG ranking or transfer component ownership
          to MLCommons.
        aliases:
