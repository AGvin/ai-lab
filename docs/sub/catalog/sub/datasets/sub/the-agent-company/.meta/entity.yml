entity:
  id: catalog/datasets/the-agent-company
  type: dataset
  name: TheAgentCompany
  aliases:
    - The Agent Company
    - The Agent Company Benchmark
  identity_note: >-
    Original publicly released 175-task simulated software-company workplace benchmark
    dataset, scoped to the 1.0.0 task snapshot. Distinct from Docker/server fixtures,
    the OpenHands baseline and evaluation harness, encrypted graders, external LLM
    judge, leaderboard records and the research publishing project. No separately
    incorporated TheAgentCompany producer has been verified.
