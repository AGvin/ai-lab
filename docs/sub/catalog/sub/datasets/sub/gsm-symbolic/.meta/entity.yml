  type: dataset
  name: GSM-Symbolic
  aliases:
    - GSM Symbolic
    - GSM-Symbolic-P1
    - GSM-Symbolic-P2
  identity_note: >-
    Apple's original symbolic-template-based GSM8K-derived mathematical reasoning
    evaluation dataset, published in 2024. Main, P1 and P2 are configurations
    of one GSM-Symbolic release, not three independent benchmark products.
    The released question and answer samples, original templates and GSM8K
    source data have different provenance and licensing boundaries.
