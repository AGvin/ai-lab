entity:
  id: catalog/datasets/longmemeval-v2
  type: dataset
  name: LongMemEval-V2
  aliases:
    - LME-V2
  identity_note: >-
    Original independently released 2026 benchmark by Di Wu and collaborators
    for evaluating long-term memory of web agents from experience in customized
    web and synthetic enterprise environments. The public publisher dataset
    contains 451 curated questions and 1,870 trajectories, across five memory
    abilities and web/enterprise domains. History haystacks may contain up to
    500 trajectories or 115 million tokens. It is a distinct original
    publication and dataset from 2024 LongMemEval's 500 conversational-memory
    questions; neither is a trained agent, evaluation harness, or memory
    service. The publisher's dataset card says Apache-2.0; that does not
    independently clear all screenshots, source assets or downstream model
    training rights. Benchmark scores and operational costs are run-specific.
