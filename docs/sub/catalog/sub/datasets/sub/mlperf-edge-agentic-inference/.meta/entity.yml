entity:
  id: catalog/datasets/mlperf-edge-agentic-inference
  type: dataset
  name: MLPerf Edge Agentic Inference
  identity_note: >-
    MLPerf Edge Agentic Inference is MLCommons' benchmark for multi-turn agentic inference on a single
    edge accelerator, introduced with MLPerf Inference v6.1. The v6.1 workload combines a BFCL-based
    deterministic accuracy gate with recorded agentic-coding replay for single-stream performance. BFCL
    retains its own benchmark identity; its use here does not transfer ownership to MLCommons. Reference
    model and quantization, traces, accuracy thresholds, latency metrics, hardware constraints and
    submission rules belong to the exact MLPerf release. Published scores describe submitted systems
    under those rules, not universal performance or safety of a device, model or autonomous agent.
  references:
    - type: article
      source:
        url: https://mlcommons.org/2026/07/mlperf-inference-v61-edge-agentic/
      purposes:
        - identification
        - research
      authority: official
    - type: article
      source:
        url: https://mlcommons.org/2026/09/mlperf-inference-v6-1-results/
      purposes:
        - identification
        - research
      authority: official
    - type: documentation
      source:
        url: https://docs.mlcommons.org/inference/index_gh/
      purposes:
        - research
      authority: official
  relations:
    - type: produced-by
      target: catalog/producers/m/mlcommons
    - type: member-of
      target: catalog/datasets/mlperf-inference
