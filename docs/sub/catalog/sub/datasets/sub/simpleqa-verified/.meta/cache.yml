          - research
          authority: official
          note: Google DeepMind research evaluation portal attributes the benchmark
            to its own and Google Research's researchers.
        - type: registry
          source:
            url: https://huggingface.co/datasets/google/simpleqa-verified
          purposes:
          - identification
          - research
          authority: official
          note: Google-published dataset card declares the 1,000-row eval split, fields,
            MIT license and tool-free intended protocol.
        - type: paper
          source:
            url: https://arxiv.org/abs/2509.07968
          purposes:
          - identification
          - research
          authority: upstream
          note: September 9, 2025 original SimpleQA Verified research paper by Haas,
            Yona, D'Antonio, Goldshtein and Das.
        - type: registry
          source:
            url: https://www.kaggle.com/benchmarks/deepmind/simpleqa-verified
          purposes:
          - research
          authority: official
          note: Official evaluation distribution and leaderboard; scores depend on
            protocol and time.
        - type: article
          source:
            url: https://openai.com/index/introducing-simpleqa/
          purposes:
