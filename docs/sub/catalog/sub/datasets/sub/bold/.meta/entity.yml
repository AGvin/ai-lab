entity:
  id: catalog/datasets/bold
  type: dataset
  name: Bias in Open-ended Language Generation (BOLD)
  aliases:
    - BOLD
    - BOLD Bias Dataset
  identity_note: >-
    Amazon Science's English-language open-ended text-generation prompt dataset for evaluating representational and topical bias in model responses. The prompts span five social domains and derive in part from Wikipedia; model generations, scoring methods and third-party source text are distinct.
