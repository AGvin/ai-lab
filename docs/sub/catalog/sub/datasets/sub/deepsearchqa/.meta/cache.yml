          authority: official
          note: Original December 11, 2025 release by Google DeepMind, distinguishing
            benchmark data from the hosted Gemini Deep Research agent.
        - type: official-site
          source:
            url: https://deepmind.google/research/evals/
          purposes:
          - identification
          - research
          authority: official
          note: Google DeepMind current benchmark listing and research characterization.
        - type: registry
          source:
            url: https://huggingface.co/datasets/google/deepsearchqa
          purposes:
          - identification
          - research
          authority: official
          note: Google-published 900-row eval CSV and Apache-2.0 metadata; source-rights
            beyond the card not independently cleared.
        - type: paper
          source:
            url: https://storage.googleapis.com/deepmind-media/DeepSearchQA/DeepSearchQA_benchmark_paper.pdf
          purposes:
          - identification
          - research
          authority: official
          note: Original Google-hosted technical report dated December 11, 2025; later
            posted to arXiv in January 2026.
        - type: paper
          source:
            url: https://arxiv.org/abs/2601.20975
