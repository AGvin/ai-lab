        name: DeepSearchQA
        identity_note: Google DeepMind's December 2025 independently released 900-prompt
          multi-step web-research benchmark across 17 fields. It assesses comprehensive
          answer-set retrieval and stopping criteria with web access, distinct from
          short-answer BrowseComp, closed-book SimpleQA Verified, the hosted Gemini
          Deep Research service and the Kaggle evaluation software.
        references:
