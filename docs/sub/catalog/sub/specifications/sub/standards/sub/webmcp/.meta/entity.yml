  name: "WebMCP"
  aliases:
    - "Web Model Context API"
  identity_note: >-
    Web Machine Learning Community Group Report, Draft dated 2 November 2026. Browser-facing
    interface allowing web applications to register JavaScript-based tools for AI agents. Not a
    W3C Standard or Standards Track specification; deployment and permission semantics are not
    assured by a draft.
