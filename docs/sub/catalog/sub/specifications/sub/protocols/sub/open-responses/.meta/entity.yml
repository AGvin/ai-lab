entity:
  id: catalog/specifications/protocols/open-responses
  name: "Open Responses"
  aliases:
    - "Open Responses Specification"
  identity_note: >-
    Open multi-provider LLM API interoperability specification derived from Responses API
    concepts. The specification defines the common schema and semantic events for item-based
    context, tool delegation, streaming and response state; it is not a deployed endpoint or a
    blanket vendor support claim.
  references:
