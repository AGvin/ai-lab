entity:
  id: catalog/specifications/protocols/nlweb
  name: NLWeb
  identity_note: >-
    An open natural-language web interaction protocol with a published v0.55 specification.
    Microsoft originally introduced NLWeb in 2025; the protocol documentation and
    Python reference implementation now reside with nlweb-ai. Protocol identity
    and reference implementation are distinct; historical origin is not proof of
    exclusive current corporate governance or production security.
