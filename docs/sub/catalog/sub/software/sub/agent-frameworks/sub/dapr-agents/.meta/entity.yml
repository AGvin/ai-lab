        url: https://github.com/dapr/dapr-agents/releases/tag/v1.1.0
      purposes: [identification, research]
      authority: official
      note: 2026-10-27 stable-tagged release, not an independent production audit.
    - type: repository
      source:
        url: https://github.com/dapr/dapr-agents/blob/v1.1.0/pyproject.toml
      purposes: [research]
      authority: official
      note: Python support and conflicting Pre-Alpha classifier.
