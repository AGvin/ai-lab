entity:
  id: catalog/software/agent-frameworks/dapr-agents
  type: software
  name: Dapr Agents
  identity_note: >-
    The Dapr community's separately packaged, self-managed Python framework
    for durable AI-agent workflows and multi-agent systems. It builds on the
    separate Dapr runtime's Workflow, Actors, pub/sub, service invocation and
    state infrastructure and can discover MCPServer tools. Official GitHub
    v1.1.0 was published 2026-10-27 as a non-prerelease Apache-2.0 release,
    with Python >=3.11,<3.15. Tagged package metadata still labels its
    development status Pre-Alpha; the upstream README carries outdated 2025
    language milestones. Neither the version tag nor project marketing proves
    production readiness, security, performance or compatibility.
  references:
    - type: repository
      source:
        url: https://github.com/dapr/dapr-agents
      purposes: [identification, research]
      authority: official
    - type: other
