entity:
  id: catalog/software/data-infrastructure/memory-and-context/hindsight
  type: software
  name: Hindsight
  identity_note: >-
    Vectorize's MIT-licensed open-source/self-hosted long-term memory system
    for AI agents, based on retain, recall and reflect operations and memory
    banks. Distinct from the vendor-operated Hindsight Cloud and from
    managed data-processing, LLM provider and benchmark services.
    Releasing memory to future agent runs requires explicit privacy,
    authorization, tenant isolation, retention, security and data-rights checks.
