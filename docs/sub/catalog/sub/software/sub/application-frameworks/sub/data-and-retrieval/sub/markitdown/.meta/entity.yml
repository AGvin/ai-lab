entity:
  id: catalog/software/application-frameworks/data-and-retrieval/markitdown
  type: software
  name: MarkItDown
  aliases:
    - Microsoft MarkItDown
    - markitdown
  identity_note: >-
    Independently distributed Microsoft-origin, MIT-licensed Python library
    and command-line utility for converting selected document, web, archive
    and media inputs to structural Markdown for language-model ingestion and
    text analysis. It is preprocessing software, not a retrieval engine,
    document-layout renderer, AI model or Microsoft-operated hosted service.
    Format support, transcription, OCR and image description depend on
    optional dependencies, plugins and sometimes third-party providers.
    Converters run with the caller process's file and network privileges.
