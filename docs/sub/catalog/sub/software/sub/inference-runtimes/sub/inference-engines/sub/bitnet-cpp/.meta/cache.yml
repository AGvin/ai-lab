        - Microsoft BitNet inference framework
        identity_note: Independently published Microsoft-origin MIT open-source inference
          framework optimized for ternary and low-bit BitNet-type LLM weights, using
          native CPU x86/ARM kernels and a separate GPU/CUDA inference component.
          It is the runtime implementation, not the trained BitNet-b1.58-2B-4T model,
          model checkpoints, a general-purpose cloud inference provider, or a hardware
          accelerator. Supported quantization formats and CPU/GPU pathways depend
          on exact model and architecture. The main README labels version 1.0 as released
          in October 2024, but no matching public GitHub Releases entry was found
          in the 2026-11-02 original-source check; document a source commit instead.
