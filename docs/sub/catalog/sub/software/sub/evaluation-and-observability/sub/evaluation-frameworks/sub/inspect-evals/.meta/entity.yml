  type: software
  name: Inspect Evals
  identity_note: >-
    An independently packaged and installable collection of evaluation
    implementations and a distributed evaluation register built on Inspect AI,
    originating with the UK AI Security Institute in 2024 and now maintained
    by Generality Labs. It is not the Inspect AI execution framework, a
    separately hosted model service, or one canonical software identity per
    included or registered benchmark.
