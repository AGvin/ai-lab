  type: software
  name: AgentOps SDK
  identity_note: >-
    MIT-licensed AgentOps Python SDK for instrumenting AI agents and LLM
    workflows using sessions, traces, replay and cost analytics. The SDK
    is distinct from the hosted AgentOps dashboard and separately
    self-hosted backend/application. Logged inputs, outputs and traces
    can expose private content, requiring explicit data capture controls.
