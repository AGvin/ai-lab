  type: software
  name: Cherry Studio
  identity_note: >-
    Cherry Studio is a desktop AI client and productivity studio for Windows, macOS and Linux. It
    connects to hosted model providers and local runtimes such as Ollama and LM Studio, with
    conversation, assistant, document and tool workflows. Those integrations remain separate providers
    and software products. CherryHQ publishes the desktop source. The official mobile listing names
    Shanghai Qianhui Technology Co., Ltd. as seller and copyright holder, while the current website
    source uses the Cherry Intelligence brand. The listing supplies legal-name evidence for the official
    ecosystem; CherryHQ and the brand are not separate legal-company proofs. The desktop Community
    Edition uses AGPL-3.0, and a separate commercial-license route is documented. Mobile, enterprise and
    hosted offerings can have other conditions. Local conversation storage does not mean all processing
    stays on the device. Configured model, MCP and other tool providers can receive prompts or content,
    and local telemetry controls do not override those providers’ processing. Review the exact edition,
    privacy settings, connected providers and tool permissions before handling sensitive material.
