  identity_note: >-
    Microsoft Research's open-source harnessed agentic reinforcement-learning
    framework. Its v1.0 API gateway, rollout controller and trainer operate with
    an existing agent harness. Distinct from PyTorch Lightning, verl, OpenRLHF
    and the separately released Agent Lightning Skill; publisher benchmarks are
    not independent AI Lab evaluations.
