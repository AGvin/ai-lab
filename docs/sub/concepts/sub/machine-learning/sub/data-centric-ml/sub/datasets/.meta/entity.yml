entity:
  id: concepts/machine-learning/data-centric-ml/datasets
  name: Datasets
  aliases:
    - Dataset
  references:
    - type: article
      source:
        url: https://www.microsoft.com/en-us/research/publication/datasheets-for-datasets/
      purposes:
        - research
      authority: independent
      note: Gebru et al. motivate dataset-level documentation of purpose, composition, collection, processing, uses, distribution, and maintenance, reinforcing that dataset identity includes lifecycle/provenance context beyond files or row count.
    - type: article
      source:
        url: https://research.google/pubs/data-cards-purposeful-and-transparent-dataset-documentation-for-responsible-ai/
      purposes:
        - research
      authority: independent
      note: Data Cards frame datasets as lifecycle artifacts whose origins, development, intent, ethical considerations, evolution, and use context must be communicated to stakeholders rather than inferred from the data payload alone.
    - type: documentation
      source:
        url: https://doi.org/10.6028/NIST.SP.1500-18r2
      purposes:
        - research
      authority: official
      note: The NIST Research Data Framework treats dataset/data-asset management through lifecycle, metadata, provenance, persistent identity, versioning, preservation, access, and fitness-for-purpose concerns.
