          authority: independent
          note: OWASP LLM01:2025 defines prompt injection vulnerabilities, distinguishes
            direct and indirect prompt injection, describes multimodal/external-content
            attack paths, and emphasizes layered application controls rather than
            treating RAG, fine-tuning, or prompting as complete prevention.
