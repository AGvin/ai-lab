entity:
  id: concepts/trustworthy-ai/security-and-resilience
  name: AI Security and Resilience
  aliases:
    - Security and Resilience
  references:
    - type: documentation
      source:
        url: https://doi.org/10.6028/NIST.AI.100-1
      purposes:
        - research
      authority: official
      note: NIST AI RMF identifies secure and resilient operation as a core trustworthy-AI characteristic and frames security/resilience across system lifecycle, context, controls, monitoring, and recovery rather than as a model-only property.
    - type: documentation
      source:
        url: https://doi.org/10.6028/NIST.AI.100-2e2025
      purposes:
        - research
      authority: official
      note: NIST AI 100-2 E2025 provides current adversarial-machine-learning taxonomy and terminology across AI lifecycle stages, attacker goals/capabilities, prompt injection, poisoning, privacy, evasion, abuse, and mitigations.
