entity:
  id: concepts/models/optimization-and-compression/quantization
  name: Quantization
  references:
    - type: article
      source:
        url: https://openaccess.thecvf.com/content_cvpr_2018/html/Jacob_Quantization_and_Training_CVPR_2018_paper.html
      purposes:
        - research
      authority: independent
      note: Foundational neural-network quantization work formalizes mapping floating-point weights and activations to integer representations for efficient inference and distinguishes quantization-aware training from ordinary floating-point inference.
    - type: documentation
      source:
        url: https://docs.nvidia.com/deeplearning/tensorrt/latest/inference-library/quantized-types-schemes.html
      purposes:
        - research
      authority: official
      note: Current TensorRT documentation demonstrates explicit quantize/dequantize mappings and modern integer and low-bit floating quantization schemes with tensor-, axis-, and block-level scaling.
    - type: article
      source:
        url: https://pytorch.org/blog/introduction-to-quantization-on-pytorch/
      purposes:
        - research
      authority: official
      note: PyTorch overview distinguishes quantized tensors and lower-precision quantized computation from floating-point execution and describes post-training and training-aware quantization workflows.
