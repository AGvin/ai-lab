entity:
  id: concepts/models/classification/reasoning-models
  name: Reasoning Models
  aliases:
    - Reasoning-Oriented Models
    - Thinking Models
  references:
    - type: documentation
      source:
        url: https://developers.openai.com/api/docs/guides/latest-model
      purposes:
        - research
      authority: official
      note: Current OpenAI model guidance exposes reasoning effort and reasoning modes on the same model family, demonstrating that reasoning-oriented behavior can be configurable rather than an immutable binary model identity.
    - type: documentation
      source:
        url: https://ai.google.dev/gemini-api/docs/generate-content/thinking
      purposes:
        - research
      authority: official
      note: Current Gemini guidance describes model-dependent adaptive thinking and configurable thinking levels/budgets, reinforcing that inference-time deliberation can vary by model and request rather than map to one universal architecture class.
    - type: article
      source:
        url: https://openreview.net/forum?id=4FWAwZtd2n
      purposes:
        - research
      authority: independent
      note: Snell et al. study scaling test-time compute for reasoning through multiple inference mechanisms, supporting a broad reasoning-oriented/test-time-compute boundary rather than equating reasoning with one visible chain-of-thought procedure.
