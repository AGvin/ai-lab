entity:
  id: concepts/models/training-and-adaptation/preference-optimization
  name: Preference Optimization
  references:
    - type: article
      source:
        url: https://arxiv.org/abs/2203.02155
      purposes:
        - research
      authority: independent
      note: InstructGPT provides a canonical preference-based post-training pipeline using human rankings, a learned reward model, and reinforcement learning after supervised fine-tuning.
    - type: article
      source:
        url: https://arxiv.org/abs/2305.18290
      purposes:
        - research
      authority: independent
      note: Direct Preference Optimization derives a direct policy objective from the standard KL-constrained reward/preference formulation and provides a major alternative to explicit reward-model plus RL training.
