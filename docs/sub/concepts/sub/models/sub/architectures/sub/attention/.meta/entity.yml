entity:
  id: concepts/models/architectures/attention
  name: Attention
  references:
    - type: article
      source:
        url: https://arxiv.org/abs/1409.0473
      purposes:
        - research
      authority: independent
      note: Foundational neural attention work using learned soft alignment to select source information relevant to each decoder prediction.
    - type: article
      source:
        url: https://arxiv.org/abs/1706.03762
      purposes:
        - research
      authority: independent
      note: Transformer paper formalizes scaled dot-product query/key/value attention and multi-head attention in a widely used modern architecture.
    - type: article
      source:
        url: https://arxiv.org/abs/1902.10186
      purposes:
        - research
      authority: independent
      note: Empirical evidence that attention weights alone should not automatically be treated as faithful explanations of model predictions.
