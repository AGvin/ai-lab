entity:
  id: concepts/models/architectures/dense-and-sparse-architectures/mixture-of-experts
  name: Mixture of Experts
  aliases:
    - MoE
  references:
    - type: article
      source:
        url: https://arxiv.org/abs/1701.06538
      purposes:
        - research
      authority: independent
      note: Foundational sparsely-gated MoE architecture using a trainable gating network to conditionally combine expert subnetworks.
    - type: article
      source:
        url: https://www.jmlr.org/papers/v23/21-0998.html
      purposes:
        - research
      authority: independent
      note: Switch Transformer provides a well-established sparse MoE routing design and documents communication, capacity, and training trade-offs.
    - type: article
      source:
        url: https://research.google/blog/mixture-of-experts-with-expert-choice-routing/
      purposes:
        - research
      authority: official
      note: Expert-choice routing demonstrates that MoE routing is not universally token-choice top-k expert selection and may assign tokens from the expert side instead.
