entity:
  id: concepts/models/inference/execution/model-loading
  name: Model Loading
  references:
    - type: documentation
      source:
        url: https://huggingface.co/docs/transformers/models
      purposes:
        - research
      authority: official
      note: Current Transformers documentation distinguishes model construction, loading pretrained weights, sharded checkpoints, device dispatch, and memory-efficient loading for large models.
    - type: documentation
      source:
        url: https://docs.pytorch.org/docs/stable/generated/torch.load.html
      purposes:
        - research
      authority: official
      note: Current PyTorch loading documentation distinguishes ordinary storage loading from memory-mapped lazy access and device remapping.
    - type: documentation
      source:
        url: https://docs.pytorch.org/tutorials/recipes/recipes/module_load_state_dict_tips.html
      purposes:
        - research
      authority: official
      note: Current PyTorch guidance demonstrates checkpoint loading through state dictionaries, memory mapping, meta-device initialization, and assignment without assuming one fixed loading path.
