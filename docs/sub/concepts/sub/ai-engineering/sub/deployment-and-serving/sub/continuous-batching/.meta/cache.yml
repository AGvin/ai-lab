          source:
            url: https://docs.vllm.ai/en/latest/api/vllm/config/scheduler/
          purposes:
          - research
          authority: upstream
          note: Current vLLM scheduler configuration exposes active-sequence, batched-token,
            admission, policy, prefill, and asynchronous scheduling controls, illustrating
            modern continuous serving schedulers without making one runtime's policy
            the canonical definition.
