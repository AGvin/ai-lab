          purposes:
          - research
          authority: official
          note: Current GitHub Copilot documentation defines plugins as installable
            packages that can bundle agents, skills, hooks, and integrations, illustrating
            a host-specific extension/package model distinct from the portable Agent
            Skills format and from runtime interoperability protocols.
