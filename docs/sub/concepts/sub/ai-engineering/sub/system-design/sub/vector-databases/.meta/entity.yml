      authority: independent
      note: Pan, Wang, and Li survey vector database management systems across data organization, vector indexes, query processing and optimization, system architectures, and both native vector-specialized and existing DBMSs extended with vector capabilities.
    - type: article
      source:
        url: https://doi.org/10.14778/3750601.3750700
      purposes:
        - research
      authority: independent
      note: Chronis et al. analyze filtered vector search as a database query-processing problem whose execution strategies depend on filter selectivity, data correlation, ANN behavior, and recall/performance trade-offs, illustrating vector-aware query optimization beyond standalone nearest-neighbor algorithms.
