        name: Coordination and Communication
        references:
        - type: documentation
          source:
            url: https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations/
          purposes:
          - research
          authority: official
          note: Current Microsoft Agent Framework distinguishes multi-agent coordination
            forms including Handoff and Group Chat from sequential/concurrent execution
            and manager-led orchestration, providing a current implementation taxonomy
            for control transfer and shared conversation.
        - type: documentation
          source:
            url: https://openai.github.io/openai-agents-python/multi_agent/
          purposes:
          - research
          authority: official
          note: Current OpenAI Agents SDK documentation explicitly distinguishes manager-retained
            delegation from handoffs where the specialist becomes the active owner,
            supporting task-ownership transfer as a distinct coordination mechanism.
        - type: documentation
          source:
            url: https://docs.langchain.com/oss/python/langchain/multi-agent
          purposes:
          - research
          authority: official
          note: Current LangChain documentation separates handoffs and router/supervisor
            patterns and treats agent transitions as state/coordination choices rather
            than one universal multi-agent topology.
