entity:
  id: concepts/agents-and-autonomy/workflows-and-orchestration/evaluator-optimizer
  name: Evaluator-Optimizer
  references:
    - type: article
      source:
        url: https://www.anthropic.com/engineering/building-effective-agents
      purposes:
        - research
      authority: official
      note: Anthropic documents evaluator-optimizer as a workflow in which one model generates or revises a response while another evaluates it against explicit criteria and supplies feedback over bounded iterations.
    - type: documentation
      source:
        url: https://openai.github.io/openai-agents-python/multi_agent/
      purposes:
        - research
      authority: official
      note: "Current OpenAI Agents SDK documentation gives code-controlled evaluator loops as a common orchestration pattern: a task agent produces output, an evaluator assesses it and returns feedback, and the loop stops when declared criteria pass."
