        id: concepts/agents-and-autonomy/workflows-and-orchestration/manager-worker-orchestration
        name: Manager-Worker Orchestration
        aliases:
        - Orchestrator-Worker
        - Supervisor-Specialist
        references:
        - type: article
          source:
            url: https://www.anthropic.com/engineering/building-effective-agents
          purposes:
          - research
          authority: official
          note: Anthropic documents the orchestrator-workers workflow in which a central
            model dynamically decomposes a task, delegates work to workers, and synthesizes
            their outputs when subtasks cannot be predicted in advance.
        - type: documentation
          source:
            url: https://openai.github.io/openai-agents-python/multi_agent/
          purposes:
          - research
          authority: official
          note: Current OpenAI Agents SDK documentation defines manager-style agents-as-tools
            as a pattern where one manager retains control of the conversation and
            calls specialist agents for bounded work, explicitly contrasting it with
            handoffs.
        - type: documentation
          source:
            url: https://docs.langchain.com/oss/python/langchain/multi-agent
          purposes:
          - research
          authority: official
          note: Current LangChain documentation describes the subagents/supervisor
            pattern as a main agent coordinating specialized subagents as tools while
            retaining centralized routing and task ownership, independently confirming
            the manager-worker family.
