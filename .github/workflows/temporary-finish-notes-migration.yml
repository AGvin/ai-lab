name: Temporary final notes migration

on:
  push:
    branches:
      - batch/ai-lab-documentation-structure/005-add-assistant-workspaces

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finish notes migration
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          export BASE
          test -z "$(git status --porcelain)"
          test -f docs/sub/notes/sub/benchmarks/sub/arena/README.md
          test -f docs/sub/notes/sub/benchmarks/sub/artificial-analysis/README.md
          test -f docs/sub/notes/sub/benchmarks/sub/benchlm/README.md
          test -f docs/sub/notes/sub/benchmarks/sub/livebench/README.md
          test -f docs/sub/notes/sub/benchmarks/sub/open-llm-leaderboard/README.md
          test -f docs/sub/notes/sub/comparisons/sub/agentic-systems/README.md

          python3 <<'PY'
          from pathlib import Path

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.strip() + '\n', encoding='utf-8')

          write('docs/sub/catalog/sub/services/sub/benchmarking/.meta/entity.yml', '''
          entity:
            id: catalog/services/benchmarking
            type: catalog-index
            name: Benchmarking
          ''')
          write('docs/sub/catalog/sub/services/sub/benchmarking/.meta/requirements.md', '''
          # Documentation Requirements

          ## Requirements

          - Present this node as the factual catalog category for identifiable hosted benchmarking and public evaluation resources.
          - Explain that the category owns service identities and their source-backed factual characteristics, not benchmark methodology as an abstract concept, benchmark run/result evidence, or recommendations derived from benchmark evidence.
          - Distinguish hosted benchmarking resources from installable/self-hosted evaluation and observability software.
          - Provide child navigation only to materialized canonical resources.

          ## Validation

          - Every child is an identifiable hosted benchmarking/evaluation resource rather than an abstract benchmark concept or one transient leaderboard view.
          - Decision-support conclusions remain outside this factual catalog category.
          ''')

          services = {
              'arena': {
                  'name': 'Arena',
                  'refs': [('official-site', 'https://arena.ai/'), ('documentation', 'https://arena.ai/leaderboard')],
                  'req': '''- Identify Arena as a hosted public AI benchmarking and leaderboard resource for comparing models across supported arenas/modalities.\n- Preserve the legacy operational classification that it is a hosted service and the decision-use warning to verify methodology, model coverage, update cadence, and leaderboard limitations before relying on rankings.\n- Link the official Arena surface and leaderboard as canonical research/identification references.\n- Do not turn leaderboard rank values into intrinsic model facts or persistent recommendations.''',
              },
              'artificial-analysis': {
                  'name': 'Artificial Analysis',
                  'refs': [('official-site', 'https://artificialanalysis.ai/'), ('documentation', 'https://artificialanalysis.ai/methodology')],
                  'req': '''- Identify Artificial Analysis as a hosted independent AI benchmarking resource covering models, inference providers/endpoints, systems, and adjacent AI-stack performance dimensions.\n- Preserve the legacy decision-use warning to verify methodology, provider/model coverage, benchmark coverage, pricing assumptions, and leaderboard limitations before using results for decisions.\n- Keep provider/model measurements as service output/evidence rather than copying them into canonical provider or model identity facts.\n- Link the official site and methodology as research/identification references.''',
              },
              'benchlm': {
                  'name': 'BenchLM',
                  'refs': [('official-site', 'https://benchlm.ai/')],
                  'req': '''- Identify BenchLM as a hosted AI benchmark/benchmark-evidence resource used to compare and evaluate AI models.\n- Preserve the legacy decision-use warning to verify methodology, model coverage, evidence provenance, update cadence, and benchmark limitations before relying on results.\n- Keep aggregated benchmark evidence distinct from canonical model facts and from AI Lab recommendations.\n- Link the official BenchLM site as the primary research/identification reference.''',
              },
              'livebench': {
                  'name': 'LiveBench',
                  'refs': [('official-site', 'https://livebench.ai/')],
                  'req': '''- Identify LiveBench as a hosted AI model benchmark and leaderboard resource for comparing model performance.\n- Preserve the legacy emphasis on methodology, update cadence, model coverage, contamination controls, and benchmark limitations as required review dimensions before decision use.\n- Keep benchmark methodology as a referenced property of the service and concrete result evidence outside intrinsic model identity facts.\n- Link the official LiveBench site as the primary research/identification reference.''',
              },
              'llm-stats': {
                  'name': 'LLM Stats',
                  'refs': [('official-site', 'https://llm-stats.com/'), ('documentation', 'https://llm-stats.com/methodology'), ('documentation', 'https://llm-stats.com/leaderboards/open-llm-leaderboard')],
                  'req': '''- Identify LLM Stats as the canonical hosted AI benchmarking hub/resource that publishes model benchmark, leaderboard, pricing, speed, and related comparison evidence.\n- Preserve the legacy Open LLM Leaderboard source as one LLM Stats leaderboard view, not as a second canonical service entity.\n- Require readers to review methodology, model inclusion criteria, evidence provenance, update cadence, and benchmark limitations before using leaderboard results for decisions.\n- Keep concrete leaderboard positions and mutable benchmark results out of intrinsic model facts.\n- Link the official LLM Stats site, methodology, and Open LLM Leaderboard view as research/identification references.''',
              },
          }

          for slug, data in services.items():
              refs = []
              for typ, url in data['refs']:
                  refs.append(f'''    - type: {typ}\n      source:\n        url: {url}\n      purposes:\n        - identification\n        - research\n      authority: official''')
              entity = 'entity:\n  id: catalog/services/benchmarking/' + slug + '\n  type: service\n  name: ' + data['name'] + '\n  references:\n' + '\n'.join(refs)
              write(f'docs/sub/catalog/sub/services/sub/benchmarking/sub/{slug}/.meta/entity.yml', entity)
              write(f'docs/sub/catalog/sub/services/sub/benchmarking/sub/{slug}/.meta/requirements.md', f'''# Documentation Requirements\n\n## Requirements\n\n{data['req']}\n\n## Validation\n\n- Facts remain source-backed and service-scoped.\n- Mutable benchmark results are not represented as timeless canonical entity facts.\n- Recommendations remain with decision support.\n''')

          write('docs/sub/decision-support/sub/selection/sub/software/.meta/entity.yml', '''
          entity:
            id: decision-support/selection/software
            type: software-selection-index
            name: Software Selection
          ''')
          write('docs/sub/decision-support/sub/selection/sub/software/.meta/node.yml', '''
          node:
            template: decision-support/selection/software/landing
            children:
              template: decision-support/selection/software/guide
          ''')
          write('docs/sub/decision-support/sub/selection/sub/software/.meta/requirements.md', '''
          # Documentation Requirements

          ## Requirements

          - Own decision support where the reader already knows software is the class being selected.
          - Keep factual software identity, licensing, capabilities, deployment, integrations, and operational facts in `catalog/software/` and link those canonical owners.
          - Materialize only substantive decision leaves; do not infer a deeper software-selection taxonomy for symmetry.
          - Support cross-category software decisions when the adoption question legitimately compares different software classes.

          ## Validation

          - The root does not mirror the factual `catalog/software/` taxonomy.
          - Each child is a real reader decision rather than an empty category placeholder.
          - Recommendation claims expose assumptions, trade-offs, and re-evaluation boundaries.
          ''')
          write('docs/sub/decision-support/sub/selection/sub/software/sub/agentic-systems/.meta/entity.yml', '''
          entity:
            id: decision-support/selection/software/agentic-systems
            type: software-selection-guide
            name: Agentic Systems Comparison
          ''')
          write('docs/sub/decision-support/sub/selection/sub/software/sub/agentic-systems/.meta/requirements.md', '''
          # Documentation Requirements

          ## Purpose

          - Help a reader choose among agentic software when the practical adoption question crosses factual software categories.
          - Compare standalone/personal agents, agent frameworks/runtimes, coding-agent control centers, and adjacent automation platforms only where agentic behavior is central to the decision.
          - Link canonical software pages instead of duplicating full resource profiles.

          ## Compared canonical software

          - `catalog/software/agents/local/hermes-agent`
          - `catalog/software/agents/local/openclaw`
          - `catalog/software/agent-frameworks/autogen`
          - `catalog/software/agent-frameworks/crewai`
          - `catalog/software/agent-frameworks/langgraph`
          - `catalog/software/agents/hybrid/openhands`
          - `catalog/software/automation/integration-automation/n8n`

          ## Required decision views

          Preserve the legacy comparison as a decision-support matrix with distinct views rather than one metadata dump:

          1. decision summary;
          2. workflow fit;
          3. control and autonomy;
          4. adoption and cost;
          5. scenario recommendations;
          6. operational review checklist;
          7. guidance for reading the comparison.

          Omit non-differentiating signals from row-level matrices and state shared assumptions once. For the currently compared set, preserve the shared baseline that deployment can be hybrid, data exposure can be high, and operational risk can be high depending on configuration; require concrete deployment verification before presenting these as universal facts.

          ## Decision summary to preserve

          - Hermes Agent: strongest when a persistent personal/workflow agent with memory, skills, automations, channels, terminal tooling, and subagents is desired; trade-off is a broad trust boundary around those capabilities.
          - OpenClaw: strongest for a local-first personal assistant spanning devices, messaging channels, workspace skills, companion surfaces, and device nodes; not the first choice for a general multi-agent programming framework.
          - AutoGen: strongest for researching/prototyping multi-agent conversations, tool use, code execution, and human-in-the-loop workflows; production durable-state/control requirements need additional architecture.
          - CrewAI: strongest for role-based crews, task delegation, tools, flows, and business-process-like multi-agent automation; lower-level graph control is not its primary abstraction.
          - LangGraph: strongest for stateful graph-structured long-running agent workflows with persistence, streaming, and explicit human oversight; trade-off is greater engineering effort and ecosystem choice.
          - OpenHands: strongest for coding-agent operations tied to repositories, shells, development environments, and engineering tools; requires strict repository/shell/backend/integration permission boundaries.
          - n8n: strongest for integration-heavy business automation combining deterministic workflow steps and agent decisions; trade-offs include licensing/commercial boundaries plus a broad credential/data surface across connected systems.

          ## Workflow-fit distinctions to preserve

          - Hermes Agent: persistent assistant/workflow agent; CLI/TUI, messaging, skills, scheduled automation, subagents; standalone adaptive agent.
          - OpenClaw: always-on personal assistant; gateway/CLI/channels/companion/device surfaces; local-first personal agent.
          - AutoGen: multi-agent conversation prototyping; Python framework/tools/code execution/optional Studio; conversation-oriented framework.
          - CrewAI: role-based collaborative automation; crews/agents/tasks/flows/knowledge and optional platform services; crew/task orchestration.
          - LangGraph: stateful agent runtime/workflow graphs; Python/JavaScript graph runtime, persistence, streaming, human-in-the-loop; graph orchestration runtime.
          - OpenHands: repository/engineering automation; Agent Canvas plus local/remote/cloud/enterprise backends and integrations; coding-agent control center.
          - n8n: integration/business-process automation mixing deterministic nodes, custom logic and AI agents; visual workflow canvas with self-hosted/cloud operation; workflow-embedded agents.

          ## Control/autonomy distinctions to preserve

          - Hermes Agent and OpenClaw can expose high-autonomy personal-agent capabilities and therefore require explicit shell/tool/channel/device/credential approval boundaries.
          - AutoGen and CrewAI provide developer-composed or role/task orchestration where oversight and sandbox semantics depend materially on application design.
          - LangGraph emphasizes explicit state, persistence, graph control, interrupt points, and engineered human-in-the-loop checkpoints.
          - OpenHands is a developer control plane whose repository/shell/integration scopes and backend isolation are primary review points.
          - n8n offers configurable autonomy inside explicit workflow logic, but connected credentials and agent tools still require deliberate scopes and guardrails.

          ## Adoption/cost distinctions to preserve

          - Hermes Agent, OpenClaw, AutoGen: permissive/open-source core with bring-your-own model/provider or adjacent service costs; review provider/integration terms.
          - CrewAI, LangGraph, OpenHands: open-source/permissive core with optional managed/open-core commercial surfaces; review hosted/enterprise/platform boundaries separately from core software.
          - n8n: source-available/fair-code self-hosted plus managed cloud/enterprise surfaces; explicitly review the applicable license and connected-service terms for the intended use.

          ## Scenario shortlist to preserve

          - Personal always-on assistant: OpenClaw or Hermes Agent.
          - Multi-agent research prototype: AutoGen or CrewAI.
          - Business workflow automation: n8n, CrewAI, or LangGraph depending on integration/deterministic-workflow, role/task, or explicit state-graph emphasis.
          - Production stateful agent architecture: LangGraph as the strongest fit among this set when explicit durable graph/state control is primary.
          - Coding-agent operations: OpenHands.
          - Maximum-autonomy experiment: Hermes Agent or OpenClaw, with the strongest safety boundaries before sensitive use.

          ## Operational review checklist

          Before recommending adoption, require review of:

          - storage of prompts, files, traces, state, memory, and outputs;
          - model/provider or hosted-service exposure of sensitive data;
          - shell, browser, repository, messaging, device, and automation access;
          - credential storage, scope, rotation, and isolation;
          - human approval gates before irreversible actions;
          - third-party skills/tools/integrations/plugins and their pinning/review model;
          - local/container/VM/cloud/enterprise backend isolation;
          - applicable core license, cloud, enterprise, provider, marketplace, and connected-service terms.

          ## Evidence and freshness policy

          - Treat the matrices as triage, not final procurement/deployment advice.
          - Resolve detailed current facts through the seven canonical software pages and their references.
          - Use `Unknown` when a differentiating signal has not been evaluated or is not supported by canonical evidence.
          - Re-verify mutable adoption, licensing, deployment, hosted-service, and security claims before changing recommendations.
          - Do not treat popularity/adoption labels from the legacy comparison as timeless facts unless current evidence explicitly supports them.

          ## Validation

          - The page remains decision support, not a duplicate factual software catalog.
          - Every compared software identity resolves to its canonical catalog owner.
          - Cross-category comparison is justified by one software-adoption decision.
          - Mutable claims are bounded by evidence and verification date at render time.
          ''')

          write('docs/.meta/templates/pages/decision-support/selection/software/landing.md', '''
          # Software Selection Landing Page

          ## Description

          Entry page for decision support where software is the known selection target.

          ## Purpose

          Route readers to substantive software-adoption decisions without mirroring the factual software catalog.

          ## Owns

          - software-selection orientation;
          - navigation to materialized software decision leaves;
          - boundary to canonical `catalog/software/` facts and general scenarios.

          ## Does Not Own

          - factual software profiles;
          - empty taxonomy branches created for symmetry.
          ''')
          write('docs/.meta/templates/pages/decision-support/selection/software/guide.md', '''
          # Software Selection Guide Page

          ## Description

          Reusable decision-support page for one bounded software-adoption question.

          ## Purpose

          Compare software alternatives across the dimensions that materially affect a declared reader decision.

          ## Owns

          - decision scope and acceptance criteria;
          - comparison dimensions and trade-offs;
          - bounded shortlist/recommendation;
          - operational review and re-evaluation triggers.

          ## Does Not Own

          - canonical software identity or intrinsic facts;
          - generic software taxonomy;
          - unsupported popularity, cost, licensing, deployment, or security claims.
          ''')

          registry = Path('docs/.meta/templates/README.md')
          text = registry.read_text(encoding='utf-8')
          if 'decision-support/selection/software/guide' not in text:
              text = text.replace('    └── decision-support/', '    └── decision-support/') if '    └── decision-support/' in text else text
              text += '\n\n## Decision-Support Software Templates\n\n- `decision-support/selection/software/landing` — software-selection target landing page.\n- `decision-support/selection/software/guide` — bounded cross-category or within-category software adoption guide.\n'
              registry.write_text(text, encoding='utf-8')
          PY

          git rm -r docs/sub/notes

          # Verify all seven decision-support software targets exist as canonical entities.
          for p in \
            docs/sub/catalog/sub/software/sub/agents/sub/local/sub/hermes-agent/.meta/entity.yml \
            docs/sub/catalog/sub/software/sub/agents/sub/local/sub/openclaw/.meta/entity.yml \
            docs/sub/catalog/sub/software/sub/agent-frameworks/sub/autogen/.meta/entity.yml \
            docs/sub/catalog/sub/software/sub/agent-frameworks/sub/crewai/.meta/entity.yml \
            docs/sub/catalog/sub/software/sub/agent-frameworks/sub/langgraph/.meta/entity.yml \
            docs/sub/catalog/sub/software/sub/agents/sub/hybrid/sub/openhands/.meta/entity.yml \
            docs/sub/catalog/sub/software/sub/automation/sub/integration-automation/sub/n8n/.meta/entity.yml; do
              test -f "$p"
          done

          python3 <<'PY'
          from pathlib import Path
          import re, sys
          errors=[]
          roots=[Path('docs/sub/catalog/sub/services/sub/benchmarking'),Path('docs/sub/decision-support/sub/selection/sub/software')]
          for root in roots:
              for f in root.rglob('entity.yml'):
                  if f.parent.name != '.meta': continue
                  txt=f.read_text(encoding='utf-8')
                  m=re.search(r'^\s*id:\s*([^\s#]+)',txt,re.M)
                  rel=f.parent.parent.relative_to(Path('docs/sub'))
                  expected='/'.join(x for x in rel.parts if x!='sub')
                  if not m or m.group(1)!=expected: errors.append(f'ID mismatch {f}: {m.group(1) if m else None} != {expected}')
              for f in root.rglob('node.yml'):
                  txt=f.read_text(encoding='utf-8')
                  for t in re.findall(r'^\s*template:\s*([^\s#]+)',txt,re.M):
                      if not (Path('docs/.meta/templates/pages')/(t+'.md')).exists(): errors.append(f'Missing template {t} from {f}')
          if Path('docs/sub/notes').exists(): errors.append('docs/sub/notes still exists')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('New migration nodes have path-consistent IDs and resolvable templates.')
          PY

          echo '--- active inbound references to removed notes tree (README_legacy historical snapshot excluded) ---'
          if git grep -n -I -E 'docs/sub/notes|notes/sub/(benchmarks|comparisons)|(\.\./)+notes/|/notes/' -- . ':!README_legacy.md' ':!.github/workflows/temporary-finish-notes-migration.yml'; then
            echo 'Unexpected active notes reference remains.' >&2
            exit 1
          fi

          # No localization content may be changed. New-system README content may not be edited.
          python3 <<'PY'
          import os, subprocess, sys
          base=os.environ['BASE']
          out=subprocess.check_output(['git','diff','--name-status','-M100',base,'--'],text=True)
          errors=[]
          for line in out.splitlines():
              parts=line.split('\t'); status=parts[0]; paths=parts[1:]
              if any('/l10n/' in f'/{p}/' for p in paths): errors.append('Localization change: '+line)
              for p in paths:
                  if p.endswith('/README.md') or p=='README.md':
                      if p.startswith('docs/sub/notes/'):
                          continue
                      if p=='docs/.meta/templates/README.md':
                          continue
                      if status!='R100': errors.append('New-system README content change: '+line)
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('No localization or renderer-owned new-system README content was edited.')
          PY

          git diff --check
          git rm -f .github/workflows/temporary-finish-notes-migration.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish legacy notes migration'
          git push origin HEAD:batch/ai-lab-documentation-structure/005-add-assistant-workspaces
