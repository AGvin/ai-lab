name: Documentation Validate

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch override; empty uses the workflow branch
        required: false
        default: ""
        type: string
      validate_schemas:
        description: Validate canonical metadata against selected schemas
        required: true
        default: true
        type: boolean
      validate_relations:
        description: Validate relation targets and inverse pairs
        required: true
        default: true
        type: boolean
      validate_cache:
        description: Validate committed documentation cache state
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: documentation-validate-${{ inputs.source_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ inputs.source_branch || github.ref_name }}

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch || github.ref_name }}
          fetch-depth: 0

      - name: Capture source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install metadata tooling
        run: python -m pip install -r tools/documentation/requirements.txt

      - name: Validate documentation metadata
        id: validate
        shell: bash
        run: |
          set -uo pipefail
          output_file="$RUNNER_TEMP/documentation-validate-output.txt"
          set +e
          python -m tools.documentation.metadata_tooling.cli validate \
            --validate-schemas "${{ inputs.validate_schemas }}" \
            --validate-relations "${{ inputs.validate_relations }}" \
            --validate-cache "${{ inputs.validate_cache }}" \
            2>&1 | tee "$output_file"
          cli_status=${PIPESTATUS[0]}
          set -e

          schemas_status="$(sed -nE 's/^schemas: (passed|failed|skipped)$/\1/p' "$output_file" | tail -n 1)"
          relations_status="$(sed -nE 's/^relations: (passed|failed|skipped)$/\1/p' "$output_file" | tail -n 1)"
          cache_status="$(sed -nE 's/^cache: (passed|failed|skipped)$/\1/p' "$output_file" | tail -n 1)"
          echo "schemas=${schemas_status}" >> "$GITHUB_OUTPUT"
          echo "relations=${relations_status}" >> "$GITHUB_OUTPUT"
          echo "cache=${cache_status}" >> "$GITHUB_OUTPUT"

          {
            echo "relation_statistics<<RELATION_STATISTICS"
            grep -E '^[a-z0-9-]+ / [a-z0-9-]+ — [0-9]+ / [0-9]+$' "$output_file" || true
            echo "RELATION_STATISTICS"
          } >> "$GITHUB_OUTPUT"

          exit "$cli_status"

      - name: Agent summary
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VALIDATE_CONCLUSION: ${{ steps.validate.conclusion }}
          SCHEMAS_STATUS: ${{ steps.validate.outputs.schemas }}
          RELATIONS_STATUS: ${{ steps.validate.outputs.relations }}
          CACHE_STATUS: ${{ steps.validate.outputs.cache }}
          RELATION_STATISTICS: ${{ steps.validate.outputs.relation_statistics }}
          REQUEST_SCHEMAS: ${{ inputs.validate_schemas }}
          REQUEST_RELATIONS: ${{ inputs.validate_relations }}
          REQUEST_CACHE: ${{ inputs.validate_cache }}
        run: |
          set -euo pipefail

          validation_status() {
            local requested="$1"
            local reported="$2"
            if [[ "$requested" != "true" ]]; then
              printf 'skipped'
            elif [[ "$reported" == "passed" || "$reported" == "failed" || "$reported" == "skipped" ]]; then
              printf '%s' "$reported"
            else
              printf 'unknown'
            fi
          }

          schemas_status="$(validation_status "$REQUEST_SCHEMAS" "$SCHEMAS_STATUS")"
          relations_status="$(validation_status "$REQUEST_RELATIONS" "$RELATIONS_STATUS")"
          cache_status="$(validation_status "$REQUEST_CACHE" "$CACHE_STATUS")"

          json="$(jq -cn \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg source_sha "$SOURCE_SHA" \
            --arg request_schemas "$REQUEST_SCHEMAS" \
            --arg request_relations "$REQUEST_RELATIONS" \
            --arg request_cache "$REQUEST_CACHE" \
            --arg schemas_status "$schemas_status" \
            --arg relations_status "$relations_status" \
            --arg cache_status "$cache_status" \
            --arg relation_statistics "$RELATION_STATISTICS" \
            'def nullable: if length > 0 then . else null end;
             {
               workflow: "documentation-validate",
               source_branch: $source_branch,
               source_sha: ($source_sha | nullable),
               requested: {
                 schemas: ($request_schemas == "true"),
                 relations: ($request_relations == "true"),
                 cache: ($request_cache == "true")
               },
               validation: {
                 schemas: $schemas_status,
                 relations: $relations_status,
                 cache: $cache_status
               },
               relation_statistics: ($relation_statistics | split("\n") | map(select(length > 0)))
             }')"

          printf 'AGENT_SUMMARY_JSON=%s\n' "$json"

          display() {
            if [[ -n "$1" ]]; then printf '%s' "$1"; else printf 'n/a'; fi
          }
          {
            echo "## Documentation Validate"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source branch | \`$SOURCE_BRANCH\` |"
            echo "| Source SHA | \`$(display "$SOURCE_SHA")\` |"
            echo "| Schemas | \`$REQUEST_SCHEMAS / $schemas_status\` |"
            echo "| Relations | \`$REQUEST_RELATIONS / $relations_status\` |"
            echo "| Cache | \`$REQUEST_CACHE / $cache_status\` |"
            if [[ -n "$RELATION_STATISTICS" ]]; then
              echo
              echo "### Relation statistics"
              echo
              while IFS= read -r line; do
                [[ -n "$line" ]] && echo "- $line"
              done <<< "$RELATION_STATISTICS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
